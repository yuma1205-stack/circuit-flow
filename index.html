            onBack={() => {
              const bs = customPlayStage.backScreen || 'select';
              setCustomPlay(null);
              if (bs === 'editor') setEditorKey(k => k + 1);
              setScreen(bs);
            }}
            onNext={null}
            bestStars={bestStars} setBestStars={setBestStars}
            bestMoves={bestMoves} setBestMoves={setBestMoves}
            taMode={settings.timeAttack === true}
            bestTimes={bestTimes} setBestTimes={setBestTimes}
            availableStars={availableStars} onSpendStars={spendStars}
          />
        );
      }
      return (
        <GameScreen
          key={currentStage}
          stageIdx={currentStage}
          onBack={() => setScreen('select')}
          onNext={() => {
            if (currentStage + 1 < STAGES.length) {
              setCurrentStage(currentStage + 1);
            } else {
              setScreen('select');
            }
          }}
          bestStars={bestStars} setBestStars={setBestStars}
          bestMoves={bestMoves} setBestMoves={setBestMoves}
          taMode={settings.timeAttack === true}
          bestTimes={bestTimes} setBestTimes={setBestTimes}
          availableStars={availableStars} onSpendStars={spendStars}
        />
      );
    }
    return (
      <StageSelect
        tab={tab}
        onTabChange={setTab}
        onSelect={(idx) => { setCurrentStage(idx); setScreen('game'); }}
        bestStars={bestStars}
        bestMoves={bestMoves}
        unlockedUpTo={unlockedUpTo}
        userStages={userStages}
        onCreateStage={() => { setEditingStage(null); setEditorKey(k => k + 1); setScreen('editor'); }}
        onEditStage={(s) => { setEditingStage(s); setEditorKey(k => k + 1); setScreen('editor'); }}
        onPlayUserStage={(s) => { setCustomPlay({ stage: s, stageKey: s.id, backScreen: 'select' }); setScreen('game'); }}
        onDeleteUserStage={handleDeleteUserStage}
        onPlayCommunityStage={(s) => {
          incPlayCount(s.id, s.play_count).catch(() => {});
          const stage = { name: s.name, grid: s.grid, minMoves: s.min_moves };
          setCustomPlay({ stage, stageKey: `community_${s.id}`, backScreen: 'select' });
          setScreen('game');
        }}
        streak={streak}
        maxStreak={maxStreak}
        dailyDone={dailyDone}
        achievements={achievements}
        onPlayDaily={(idx) => { setCurrentStage(idx); setScreen('game'); }}
        onOpenSettings={() => setShowSettings(true)}
        onPlayChallenge={() => setScreen('challenge')}
        challengeBest={challengeBest}
        onOpenGacha={() => setScreen('gacha')}
        dailyGachaAvailable={lastDailyDraw !== todayStr()}
        themesOwned={themesOwned}
        wireSkinsOwned={wireSkinsOwned}
      />
    );
  };

  const goToTab = (t) => { setTab(t); setScreen('select'); };

  const activeWire = WIRE_SKINS_BY_ID[activeWireSkin] || WIRE_SKINS[0];
  const skinValue = React.useMemo(() => ({
    wire: activeWire,
    mirror: activeMirrorShape,
    portal: activePortalShape,
    source: skinPool.source?.active || 'default',
    bulb:   skinPool.bulb?.active   || 'default',
    gate:   skinPool.gate?.active   || 'default',
    switch: skinPool.switch?.active || 'default',
    fuse:   skinPool.fuse?.active   || 'default',
    gear:   skinPool.gear?.active   || 'default',
    effect: skinPool.effect?.active || 'default',
    sound:  skinPool.sound?.active  || 'default',
  }), [activeWire, activeMirrorShape, activePortalShape, skinPool]);

  return (
    <SkinContext.Provider value={skinValue}>
      {screen !== 'game' && (
        <>
          <nav className="sidebar">
            <div className="sidebar-logo"><Icon name="bolt" size={26} gold /></div>
            <div className="sidebar-divider" />
            <button
              className={`sidebar-btn${screen === 'select' && tab === 'stages' ? ' active' : ''}`}
              onClick={() => goToTab('stages')}
              title="ステージ選択"
            >
              <TabIcon name="stages" active={screen === 'select' && tab === 'stages'} />
              <span className="sb-label">ステージ</span>
            </button>
            <button
              className={`sidebar-btn${screen === 'select' && tab === 'myStages' ? ' active' : ''}`}
              onClick={() => goToTab('myStages')}
              title="マイステージ"
            >
              <TabIcon name="myStages" active={screen === 'select' && tab === 'myStages'} />
              <span className="sb-label">マイ</span>
            </button>
            <button
              className={`sidebar-btn${screen === 'select' && tab === 'community' ? ' active' : ''}`}
              onClick={() => goToTab('community')}
              title="みんなのステージ"
            >
              <TabIcon name="community" active={screen === 'select' && tab === 'community'} />
              <span className="sb-label">みんな</span>
            </button>
            <button
              className={`sidebar-btn${screen === 'select' && tab === 'profile' ? ' active' : ''}`}
              onClick={() => goToTab('profile')}
              title="プロフィール"
            >
              <TabIcon name="profile" active={screen === 'select' && tab === 'profile'} />
              <span className="sb-label">実績</span>
            </button>
            <div className="sidebar-divider" />
            <button
              className={`sidebar-btn${screen === 'editor' ? ' active' : ''}`}
              onClick={() => { setEditingStage(null); setEditorKey(k => k + 1); setScreen('editor'); }}
              title="ステージを作る"
            >
              <TabIcon name="editor" active={screen === 'editor'} />
              <span className="sb-label">作る</span>
            </button>
          </nav>
          <nav className="bottombar">
            <button
              className={`bottombar-btn${screen === 'select' && tab === 'stages' ? ' active' : ''}`}
              onClick={() => goToTab('stages')}
            >
              <TabIcon name="stages" active={screen === 'select' && tab === 'stages'} />
              <span className="bb-label">ステージ</span>
            </button>
            <button
              className={`bottombar-btn${screen === 'select' && tab === 'myStages' ? ' active' : ''}`}
              onClick={() => goToTab('myStages')}
            >
              <TabIcon name="myStages" active={screen === 'select' && tab === 'myStages'} />
              <span className="bb-label">マイ</span>
            </button>
            <button
              className={`bottombar-btn${screen === 'select' && tab === 'community' ? ' active' : ''}`}
              onClick={() => goToTab('community')}
            >
              <TabIcon name="community" active={screen === 'select' && tab === 'community'} />
              <span className="bb-label">みんな</span>
            </button>
            <button
              className={`bottombar-btn${screen === 'select' && tab === 'profile' ? ' active' : ''}`}
              onClick={() => goToTab('profile')}
            >
              <TabIcon name="profile" active={screen === 'select' && tab === 'profile'} />
              <span className="bb-label">実績</span>
            </button>
            <button
              className={`bottombar-btn${screen === 'editor' ? ' active' : ''}`}
              onClick={() => { setEditingStage(null); setEditorKey(k => k + 1); setScreen('editor'); }}
            >
              <TabIcon name="editor" active={screen === 'editor'} />
              <span className="bb-label">作る</span>
            </button>
          </nav>
        </>
      )}
      {newAchievement && (
        <div className="ach-toast">
          <div className="ach-toast-icon"><Icon name="medal" size={48} /></div>
          <div>
            <div className="ach-toast-label">ACHIEVEMENT UNLOCKED</div>
            <div className="ach-toast-name">{newAchievement.name}</div>
            <div className="ach-toast-desc">{newAchievement.desc}</div>
          </div>
        </div>
      )}
      {showSettings && (
        <div className="settings-overlay" onClick={() => setShowSettings(false)}>
          <div className="settings-modal" onClick={e => e.stopPropagation()}>
            <div className="settings-header">
              <Icon name="settings" size={22} />
              <h2 className="settings-title">設定</h2>
              <button className="settings-close" onClick={() => setShowSettings(false)} aria-label="閉じる">×</button>
            </div>
            <div className="settings-section">
              <div className="settings-row">
                <div>
                  <div className="settings-row-title">サウンド</div>
                  <div className="settings-row-sub">効果音を再生</div>
                </div>
                <label className="toggle">
                  <input type="checkbox" checked={settings.sound !== false} onChange={e => updateSetting('sound', e.target.checked)} />
                  <span className="toggle-slider" />
                </label>
              </div>
              <div className="settings-row">
                <div>
                  <div className="settings-row-title">振動</div>
                  <div className="settings-row-sub">モバイル端末で操作時に振動 (対応端末のみ)</div>
                </div>
                <label className="toggle">
                  <input type="checkbox" checked={settings.haptic !== false} onChange={e => updateSetting('haptic', e.target.checked)} />
                  <span className="toggle-slider" />
                </label>
              </div>
              <div className="settings-row">
                <div>
                  <div className="settings-row-title">タイムアタック</div>
                  <div className="settings-row-sub">タイマーを表示してクリア時間を記録</div>
                </div>
                <label className="toggle">
                  <input type="checkbox" checked={settings.timeAttack === true} onChange={e => updateSetting('timeAttack', e.target.checked)} />
                  <span className="toggle-slider" />
                </label>
              </div>
            </div>
            <div className="settings-section">
              <div className="settings-section-label">データ管理</div>
              <button className="btn settings-danger" onClick={() => {
                if (confirm('本当に全てのセーブデータをリセットしますか？\nスター・実績・連続記録・デイリー記録がすべて消去されます。')) {
                  try {
                    Object.keys(localStorage).filter(k => k.startsWith('cf_')).forEach(k => localStorage.removeItem(k));
                    location.reload();
                  } catch {}
                }
              }}>すべてのセーブデータをリセット</button>
            </div>
            <div className="settings-section">
              <div className="settings-section-label">情報</div>
              <div className="settings-info">Circuit Flow · 130 ステージ · v1.0</div>
            </div>
          </div>
        </div>
      )}
      {sharedStage && (
        <div className="import-overlay">
          <div className="import-card">
            <div className="import-label">シェアされたステージ</div>
            <div className="import-title">{sharedStage.name}</div>
            <div className="import-meta">
              {sharedStage.grid.length}×{sharedStage.grid[0]?.length} ／ ★★★基準: {sharedStage.minMoves}手
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <button className="btn primary" onClick={() => {
                setCustomPlay({ stage: sharedStage, stageKey: null, backScreen: 'select' });
                setSharedStage(null);
                setScreen('game');
              }}>▶ プレイする</button>
              <button className="btn" onClick={() => {
                setUserStages(prev => [...prev, { id: `user_${Date.now()}`, ...sharedStage, isUserCreated: true }]);
                setSharedStage(null);
              }}>💾 マイステージに保存</button>
              <button className="btn" onClick={() => setSharedStage(null)}
                style={{ background: 'transparent', border: '1px solid #223', color: '#556' }}>
                閉じる
              </button>
            </div>
          </div>
        </div>
      )}
      {renderScreen()}
    </SkinContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
// PWA service worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
