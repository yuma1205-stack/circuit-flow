  <title>Circuit Flow — 回路パズル</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Theme CSS variables (overridden by [data-theme]) */
    :root {
      --cf-bg-1: #0a0e1a;
      --cf-bg-2: #0a0e1a;
      --cf-accent: #7ddfff;
      --cf-accent-2: #4a9fd1;
      --cf-glow: #00ffcc;
      --cf-glow-rgb: 0, 255, 204;
      --cf-title-shadow: rgba(125, 223, 255, 0.4);
    }
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
    }
    button, .cell, .duo-node, .palette-item, .sidebar-btn, .bottombar-btn,
    .daily-card, .ach-card, .csi-play, .csi-like {
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    body {
      background: linear-gradient(180deg, var(--cf-bg-1) 0%, var(--cf-bg-2) 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #root { width: 100%; max-width: 480px; }
    .screen { display: flex; flex-direction: column; align-items: center; padding: 16px; }

    /* Header */
    .header { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stage-label { font-size: 10px; color: var(--cf-accent); opacity: 0.7; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
    .stage-title { font-size: 20px; font-weight: 800; color: #e0eaff; letter-spacing: 0.5px; text-shadow: 0 0 16px var(--cf-title-shadow); }
    .moves-label { font-size: 10px; color: var(--cf-accent); opacity: 0.7; letter-spacing: 3px; text-align: right; text-transform: uppercase; font-weight: 700; }
    .moves-val {
      font-size: 22px; font-weight: 800; color: var(--cf-accent); text-align: right;
      font-feature-settings: 'tnum' 1;
      text-shadow: 0 0 14px var(--cf-title-shadow);
    }
    .ta-badge {
      display: inline-block; margin-left: 8px; padding: 2px 6px;
      font-size: 8px; letter-spacing: 1.5px; font-weight: 800;
      color: #0a0e1a; background: linear-gradient(135deg, #ffd166, #c89a1a);
      border-radius: 4px; vertical-align: middle;
      box-shadow: 0 0 8px rgba(255, 209, 102, 0.5);
    }
    .ta-time {
      font-size: 16px; font-weight: 700; color: #ffd166;
      font-family: monospace; font-feature-settings: 'tnum' 1;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
      letter-spacing: 0.5px; margin-top: 2px;
    }

    /* Grid */
    .grid-wrapper { padding: 8px; background: #0d1225; border-radius: 16px; border: 1px solid #1a2040; box-shadow: 0 0 40px #001; }
    /* Editor grid: capture all pointer gestures (no browser scroll/zoom interference) */
    .editor-grid-wrapper, .editor-grid-wrapper .cell { touch-action: none; }
    .grid { display: grid; gap: 4px; }

    /* Narrow screens: tighter padding to give the grid more room */
    @media (max-width: 419px) {
      .screen { padding: 8px; }
      .grid-wrapper { padding: 4px; }
      .header { margin-bottom: 8px; }
    }
    .cell {
      background: #111827;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .cell:active { background: #1a2535; }
    .cell.powered { background: #0a1a2a; }
    .cell.source, .cell.bulb { cursor: default; }
    .cell svg { position: absolute; top: 0; left: 0; overflow: visible; }

    /* Rotating animation */
    @keyframes spin-cw  { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
    @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-90deg); } }
    .cell.rotating-cw  svg { animation: spin-cw  0.12s ease-out forwards; transform-origin: 36px 36px; }
    .cell.rotating-ccw svg { animation: spin-ccw 0.12s ease-out forwards; transform-origin: 36px 36px; }

    /* Glow effect for powered wires */
    .powered-wire { filter: drop-shadow(0 0 4px var(--cf-glow)) drop-shadow(0 0 8px rgba(var(--cf-glow-rgb), 0.5)); }
    .bulb-glow { filter: drop-shadow(0 0 8px #ffee00) drop-shadow(0 0 16px #ffaa00); }

    /* Flow pulse on clear */
    @keyframes flow-pulse-anim {
      0%   { opacity: 0; transform: scale(0.6); }
      35%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.25); }
    }
    .flow-pulse {
      position: absolute;
      inset: -2px;
      border-radius: 10px;
      background: radial-gradient(circle, #00ffcc 0%, #00ffcc66 35%, transparent 75%);
      opacity: 0;
      pointer-events: none;
      animation: flow-pulse-anim 0.5s ease-out forwards;
      mix-blend-mode: screen;
    }

    /* Step tutorial overlay */
    .tut-step-overlay {
      position: fixed; inset: 0;
      background: #0006;
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
      padding-bottom: 24px;
    }
    .tut-step-box {
      background: #1a2040;
      border: 1px solid #334;
      border-radius: 20px;
      padding: 28px 32px 24px;
      width: min(340px, 90vw);
      text-align: center;
      box-shadow: 0 -4px 40px #000a;
      animation: slide-up 0.25s ease-out;
    }
    @keyframes slide-up {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .tut-step-dots {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;
    }
    .tut-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #334; transition: background 0.2s;
    }
    .tut-dot.active { background: #00ffcc; }
    .tut-step-icon {
      font-size: 36px; margin-bottom: 14px;
      letter-spacing: 4px;
    }
    .tut-step-text {
      font-size: 16px; color: #bbd; line-height: 1.8;
      white-space: pre-line; margin-bottom: 24px;
    }

    /* Clear overlay */
    .clear-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, rgba(20, 30, 60, 0.85), rgba(0, 0, 0, 0.95));
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn 0.4s ease;
      overflow: hidden;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes clearBoxIn {
      0% { transform: scale(0.7) translateY(20px); opacity: 0; }
      60% { transform: scale(1.04) translateY(-4px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes confetti {
      0% { transform: translateY(-30vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .clear-box {
      background:
        radial-gradient(ellipse at top, rgba(125, 223, 255, 0.18), transparent 60%),
        linear-gradient(160deg, #0e1230 0%, #0a0e22 100%);
      border: 1px solid rgba(125, 223, 255, 0.35);
      border-radius: 22px;
      padding: 36px 44px;
      text-align: center;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 0 0 1px rgba(255,255,255,0.05),
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(125, 223, 255, 0.25);
      animation: clearBoxIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      max-width: 380px;
      width: 86vw;
      position: relative; z-index: 2;
    }
    .clear-box.perfect {
      border-color: rgba(255, 210, 100, 0.5);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 0 0 1px rgba(255, 210, 100, 0.15),
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 100px rgba(255, 180, 60, 0.35);
    }
    .clear-title {
      font-size: 36px; font-weight: 900;
      background: linear-gradient(135deg, #7ddfff 0%, #c4ecff 50%, #7ddfff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      margin-bottom: 8px; letter-spacing: 4px;
      animation: shimmerText 3s linear infinite;
    }
    .clear-box.perfect .clear-title {
      background: linear-gradient(135deg, #ffd166 0%, #ffe28a 50%, #ffd166 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
    }
    @keyframes shimmerText { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .clear-sub { font-size: 12px; color: #7a8aa8; margin-bottom: 24px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
    .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; font-size: 0; }
    .stars .star {
      display: inline-block; width: 40px; height: 40px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stars .star.lit { animation: starPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform: scale(0); }
    .stars .star.lit.s1 { animation-delay: 0.3s; }
    .stars .star.lit.s2 { animation-delay: 0.5s; }
    .stars .star.lit.s3 { animation-delay: 0.7s; }
    @keyframes starPop {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.4) rotate(0deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    /* Confetti */
    .confetti-piece {
      position: absolute; width: 8px; height: 14px;
      animation: confetti 2.5s linear forwards;
      z-index: 1;
    }
    /* Effect skin: sparkle — round shimmering particles */
    body.eff-sparkle .confetti-piece {
      width: 8px; height: 8px; border-radius: 50%;
      box-shadow: 0 0 8px currentColor, 0 0 14px rgba(255,255,255,0.4);
      animation: confetti 2.8s ease-out forwards, sparkleTwinkle 0.4s ease-in-out infinite alternate;
    }
    @keyframes sparkleTwinkle { from { opacity: 0.5; } to { opacity: 1; } }
    body.eff-sparkle .flow-pulse {
      background: radial-gradient(circle, #fff 0%, var(--cf-glow) 30%, transparent 75%);
      animation-duration: 0.65s;
    }
    /* Effect skin: lightning — narrow bolt-like slivers */
    body.eff-lightning .confetti-piece {
      width: 3px; height: 22px; border-radius: 1px;
      box-shadow: 0 0 6px currentColor, 0 0 14px currentColor;
      transform: rotate(20deg);
      animation: confetti 1.6s linear forwards;
    }
    body.eff-lightning .flow-pulse {
      background: radial-gradient(circle, #ffffff 0%, var(--cf-glow) 25%, transparent 70%);
      mix-blend-mode: screen;
      animation-duration: 0.4s;
    }
    .btn {
      background: #1a3a6a;
      border: 1px solid #2a5aaa;
      color: #adf;
      font-size: 16px;
      padding: 12px 32px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      display: block; width: 100%; margin-bottom: 10px;
    }
    .btn:hover { background: #2a4a8a; }
    .btn.primary { background: #1a5aaa; border-color: #3a7acc; color: #fff; font-weight: 700; }
    .btn.primary:hover { background: #2a6acc; }

    /* Stage select - premium path style */
    .stage-select { width: 100%; }
    .stage-select h1 {
      font-size: 30px; font-weight: 900;
      background: linear-gradient(135deg, #7ddfff 0%, #c4ecff 30%, #ffd166 60%, #7ddfff 100%);
      background-size: 250% auto;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      letter-spacing: 4px; text-align: left;
      animation: titleShimmer 6s linear infinite;
      filter: drop-shadow(0 0 16px rgba(125, 223, 255, 0.3));
    }
    @keyframes titleShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }
    .stage-select .tagline {
      text-align: left; color: #5a6580; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase; font-weight: 700;
      margin-bottom: 24px;
    }
    .header-row { padding-bottom: 4px; }

    .duo-section { width: 100%; margin-bottom: 18px; }
    .duo-banner {
      width: 100%; border-radius: 14px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 12px;
      position: relative;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.04), transparent 60%),
        linear-gradient(160deg, #1a1f38 0%, #0e1226 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 3px solid var(--banner-color, #7df);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 4px 14px rgba(0, 0, 0, 0.35);
    }
    .duo-banner::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at left, var(--banner-color, transparent) 0%, transparent 35%);
      opacity: 0.15; border-radius: 14px; pointer-events: none;
    }
    .duo-banner-icon {
      width: 52px; height: 52px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 8px rgba(0,0,0,0.3);
      filter: drop-shadow(0 0 8px var(--banner-color, transparent));
      position: relative; z-index: 1;
    }
    .duo-banner-title {
      font-size: 16px; font-weight: 800; color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px var(--banner-color, transparent);
      position: relative; z-index: 1;
    }
    .duo-banner-sub {
      font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 3px;
      letter-spacing: 0.3px;
      position: relative; z-index: 1;
    }

    .duo-nodes { width: 100%; padding: 4px 0; }
    .duo-node-wrap {
      margin-bottom: 16px; display: flex; flex-direction: column; align-items: center;
      margin-left: calc(var(--pos) - 32px); width: 64px;
    }
    .duo-node {
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; font-weight: 800;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      user-select: none; -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), transparent 50%),
        radial-gradient(circle at 70% 70%, var(--nd-sh, #252830), var(--nd-bg, #3a4050));
      color: #fff;
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.3),
        inset 0 -2px 4px rgba(0,0,0,0.35),
        0 5px 0 var(--nd-sh, #252830),
        0 6px 14px rgba(0,0,0,0.4);
      position: relative;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .duo-node:active:not(.locked) {
      transform: translateY(4px);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.3),
        inset 0 -2px 4px rgba(0,0,0,0.35),
        0 1px 0 var(--nd-sh, #252830),
        0 2px 6px rgba(0,0,0,0.3);
    }
    .duo-node.locked {
      cursor: not-allowed;
      background: linear-gradient(160deg, #2a2d3a, #1a1c24);
      color: #555a70;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 3px 0 #15161e,
        0 4px 8px rgba(0,0,0,0.3);
      text-shadow: none;
    }
    .duo-node.completed {
      box-shadow:
        inset 0 1.5px 0 rgba(255,230,150,0.45),
        inset 0 -2px 4px rgba(0,0,0,0.35),
        0 5px 0 var(--nd-sh, #252830),
        0 0 16px rgba(255, 210, 100, 0.35),
        0 6px 14px rgba(0,0,0,0.4);
    }
    .duo-node.featured::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2.5px solid rgba(125, 223, 255, 0.85);
      animation: duo-ring 1.8s ease-out infinite;
      pointer-events: none;
      box-shadow: 0 0 16px rgba(125, 223, 255, 0.5);
    }
    @keyframes duo-ring {
      0%   { opacity: 0.95; transform: scale(1); }
      100% { opacity: 0;    transform: scale(1.6); }
    }
    .duo-node-stars { display: flex; gap: 2px; margin-top: 6px; line-height: 1; }
    .duo-node-stars span {
      font-size: 13px;
      filter: drop-shadow(0 0 4px rgba(255,210,100,0.5));
    }

    .section-label { font-size: 11px; letter-spacing: 2px; color: #334; text-transform: uppercase; margin: 16px 0 8px; }

    /* Locked cell */
    .cell.locked { cursor: not-allowed; box-shadow: inset 0 0 0 1px #3a5a8a; }
    .cell.bridge { cursor: default; }

    /* Parts bin (placement mode) */
    .parts-bin {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      margin-top: 12px; padding: 10px 10px 8px;
      background: rgba(20, 28, 48, 0.55);
      border: 1px solid #2a3a5a; border-radius: 12px;
    }
    .parts-bin-label {
      flex-basis: 100%; text-align: center; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; color: #5fd0c0; text-transform: uppercase; margin-bottom: 2px;
    }
    .bin-item {
      position: relative; display: flex; flex-direction: column; align-items: center;
      padding: 5px 10px 3px; background: linear-gradient(135deg, #16203a, #0e1424);
      border: 2px solid #2a3a5a; border-radius: 10px; cursor: pointer;
      transition: transform 0.1s, border-color 0.12s, box-shadow 0.12s;
    }
    .bin-item:hover:not(.depleted) { transform: translateY(-2px); border-color: #4a7ac0; }
    .bin-item:active:not(.depleted) { transform: translateY(0); }
    .bin-item.selected {
      border-color: #7ddfff;
      box-shadow: 0 0 0 2px rgba(125,223,255,0.3), 0 0 14px rgba(125,223,255,0.35);
      background: linear-gradient(135deg, #1a2c4a, #122036);
    }
    .bin-item.depleted { opacity: 0.32; cursor: not-allowed; filter: grayscale(0.6); }
    .bin-count { font-size: 12px; font-weight: 800; color: #aab8d8; margin-top: 1px; letter-spacing: 0.5px; }
    .bin-item.selected .bin-count { color: #7ddfff; }

    /* Empty placement slots in the grid */
    .cell.slot::after {
      content: ''; position: absolute; inset: 6px;
      border: 2px dashed rgba(125,223,255,0.35); border-radius: 8px; pointer-events: none;
    }
    .cell.slot-active::after {
      border-color: rgba(125,223,255,0.9);
      animation: slotPulse 1s ease-in-out infinite;
    }
    @keyframes slotPulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }

    /* Hint button */
    .hint-btn {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #334;
      color: #556;
      font-size: 13px;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .hint-btn:hover { border-color: #556; color: #778; }
    .hint-btn.used { opacity: 0.4; cursor: not-allowed; }
    .hint-btn.hint-tier {
      margin-top: 0;
      background: linear-gradient(135deg, #1a2040 0%, #0e1230 100%);
      border-color: rgba(125, 223, 255, 0.25);
      color: #d8e0f0;
      font-weight: 700;
    }
    .hint-btn.hint-tier:hover:not(.used) { border-color: rgba(255, 209, 102, 0.6); color: #fff; box-shadow: 0 0 12px rgba(255, 209, 102, 0.2); }
    .hint-btn.rot-toggle {
      margin-top: 0;
      background: linear-gradient(135deg, #0e1230, #1a2040);
      border-color: rgba(125, 223, 255, 0.4);
      color: #c4ecff;

    /* Challenge select screen */

<script type="text/babel">
const { useState, useCallback, useEffect, useRef } = React;

// Responsive cell sizing: tracks viewport width, recomputes on resize
function useViewportWidth() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 480);
  useEffect(() => {
    const onResize = () => setW(window.innerWidth);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
    };
  }, []);
  return w;
}

// cols → cell px, capped at a desktop "ideal" but shrinking to fit narrow screens
function fitCellSize(vw, cols, ideal, minPx = 32) {
  // narrow screens use reduced padding (see @media below): screen 8*2 + wrapper 4*2 = 24
  const pad = vw < 420 ? 24 : 48;
  const avail = Math.min(vw, 480) - pad;
  const fit = Math.floor((avail - (cols - 1) * 4) / cols);
  return Math.max(minPx, Math.min(ideal, fit));
}

// ─── Directions: 0=N 1=E 2=S 3=W ────────────────────────────────────────────
const OPPOSITE = [2, 3, 0, 1];
const DIR_DELTA = [[-1,0],[0,1],[1,0],[0,-1]];

function getConnections(type, rot) {
  const r = ((rot % 4) + 4) % 4;
  switch (type) {
    case 'straight': return r % 2 === 0 ? [0,2] : [1,3];
    case 'l':        return [[0,1],[1,2],[2,3],[3,0]][r];
    case 't':        return [[1,2,3],[0,2,3],[0,1,3],[0,1,2]][r];
    case 'cross':    return [0,1,2,3];
    case 'bridge':   return [0,1,2,3];
    case 'source':
    case 'bulb':     return [[2],[3],[0],[1]][r];
    case 'oneway':   return [OPPOSITE[r], r];        // input + output endpoints
    case 'mirror':   return [0,1,2,3];               // all 4 sides; BFS handles reflection
    case 'router': {                                  // T with toggleable active arm
      const armCW  = [1,2,3,0][r]; // clockwise perpendicular to input
      const armCCW = [3,0,1,2][r]; // counter-clockwise perpendicular
      return [[2,3,0,1][r], armCW, armCCW];          // [inputDir, armCW, armCCW]
    }
    case 'switch':   return [0,1,2,3];                // 4-way (rotation ignored)
    case 'gate':     return r % 2 === 0 ? [0,2] : [1,3]; // straight-shaped
    case 'resistor': return r % 2 === 0 ? [0,2] : [1,3]; // straight (-1 power)
    case 'amp':      return r % 2 === 0 ? [0,2] : [1,3]; // straight (+1 power)
    case 'resistorL':return [[0,1],[1,2],[2,3],[3,0]][r]; // L-shape (-1)
    case 'ampL':     return [[0,1],[1,2],[2,3],[3,0]][r]; // L-shape (+1)
    case 'gear':     return [[0,1],[1,2],[2,3],[3,0]][r]; // L-shape, chains to adjacent gears
    case 'fuse':     return r % 2 === 0 ? [0,2] : [1,3];  // straight, blows above limit
    case 'igate':    return r % 2 === 0 ? [0,2] : [1,3];  // straight, open when switch UNlit
    case 'portal':   return [[2],[3],[0],[1]][r];          // single endpoint, teleports to pair
    case 'splitter': return [r, (r+1)%4, (r+3)%4];        // input + 2 perpendicular outputs
    case 'andgate':  return r % 2 === 0 ? [0,2] : [1,3];   // straight; open only when ALL linked switches lit
    case 'trap':     return [0,1,2,3];                     // 4-way wire; powering it fails the puzzle
    default:         return [];
  }
}

// Available colors for sources/bulbs
const COLOR_HEX = {
  cyan:   '#00ffcc',
  red:    '#ff5566',
  yellow: '#ffdd44',
  mixed:  '#ffffff',
};
const COLOR_OFF = {
  cyan:   '#2a3a5a',
  red:    '#5a2a3a',
  yellow: '#5a5530',
};

function computePowered(grid) {
  const rows = grid.length, cols = grid[0].length;
  const sources = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (grid[r][c].type === 'source')
        sources.push({ r, c, color: grid[r][c].color || 'cyan', initialPower: grid[r][c].initialPower || 9 });

  const switchLit = {}; // linkId -> bool (current lit state of switch)
  const byColor = {};  // color -> 2D int level array (0 = unpowered)
  const MAX_POWER = 9;

  // Portal pairs: linkId -> [{r,c}, {r,c}]
  const portals = {};
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (grid[r][c].type === 'portal') {
        const id = grid[r][c].linkId;
        (portals[id] = portals[id] || []).push({ r, c });
      }

  const emptyMask = () => Array.from({length: rows}, () => new Array(cols).fill(0));

  function connsOf(cell) {
    if (cell.type === 'gate' && !switchLit[cell.linkId]) return [];
    if (cell.type === 'igate' && switchLit[cell.linkId]) return [];
    if (cell.type === 'andgate') {
      const ids = [cell.linkId, cell.linkId2].filter(Boolean);
      if (ids.length === 0 || !ids.every(id => switchLit[id])) return [];
    }
    return getConnections(cell.type, cell.rotation);
  }

  function powerDelta(type) {
    if (type === 'resistor' || type === 'resistorL') return -1;
    if (type === 'amp' || type === 'ampL') return +1;
    return 0;
  }

  function bfsFrom(src, levelMask) {
    if (src.initialPower < 1) return;
    if (src.initialPower > levelMask[src.r][src.c]) levelMask[src.r][src.c] = src.initialPower;
    const stateMax = new Map();
    stateMax.set(`${src.r},${src.c},-1`, src.initialPower);
    const pq = [[src.initialPower, src.r, src.c, -1]];
    while (pq.length) {
      // Pop max-power entry (Dijkstra)
      let mi = 0;
      for (let i = 1; i < pq.length; i++) if (pq[i][0] > pq[mi][0]) mi = i;
      const [power, r, c, entryDir] = pq.splice(mi, 1)[0];
      if ((stateMax.get(`${r},${c},${entryDir}`) || 0) > power) continue;
      const cell = grid[r][c];
      let outPower = power + powerDelta(cell.type);
      if (outPower > MAX_POWER) outPower = MAX_POWER;
      if (outPower < 1) continue;
      // Portal: power that reached this portal jumps out of its paired portal
      if (cell.type === 'portal' && entryDir !== -1) {
        const pairList = portals[cell.linkId] || [];
        const pair = pairList.find(p => p.r !== r || p.c !== c);
        if (pair) {
          const outDir = getConnections('portal', grid[pair.r][pair.c].rotation)[0];
          const nr = pair.r + DIR_DELTA[outDir][0];
          const nc = pair.c + DIR_DELTA[outDir][1];
          if (outPower > levelMask[pair.r][pair.c]) levelMask[pair.r][pair.c] = outPower;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            const ncell = grid[nr][nc];
            const nconns = connsOf(ncell);
            if (nconns.includes(OPPOSITE[outDir]) &&
                !(ncell.type === 'oneway' && OPPOSITE[outDir] !== OPPOSITE[ncell.rotation]) &&
                ncell.type !== 'source' &&
                !(ncell.type === 'fuse' && outPower > (ncell.limit || 2))) {
              const nKey = `${nr},${nc},${OPPOSITE[outDir]}`;
              if (outPower > (stateMax.get(nKey) || 0)) {
                stateMax.set(nKey, outPower);
                if (outPower > levelMask[nr][nc]) levelMask[nr][nc] = outPower;
                pq.push([outPower, nr, nc, OPPOSITE[outDir]]);
              }
            }
          }
        }
        continue;
      }
      let exitConns;
      if (cell.type === 'oneway') {
        exitConns = (entryDir === OPPOSITE[cell.rotation] || entryDir === -1) ? [cell.rotation] : [];
      } else if (cell.type === 'bridge' && entryDir !== -1) {
        exitConns = [OPPOSITE[entryDir]];
      } else if (cell.type === 'mirror') {
        // / (rot even): pairs {N,W} and {S,E} via XOR 3
        // \ (rot odd):  pairs {N,E} and {S,W} via XOR 1
        if (entryDir === -1) exitConns = [];
        else exitConns = [cell.rotation % 2 === 0 ? (entryDir ^ 3) : (entryDir ^ 1)];
      } else if (cell.type === 'router') {
        const r4 = ((cell.rotation % 4) + 4) % 4;
        const inputDir = [2,3,0,1][r4];
        if (entryDir === inputDir || entryDir === -1) {
          exitConns = [(cell.state || 0) === 0 ? [1,2,3,0][r4] : [3,0,1,2][r4]];
        } else exitConns = [];
      } else if (cell.type === 'splitter') {
        const r4 = ((cell.rotation % 4) + 4) % 4;
        if (entryDir === r4 || entryDir === -1) {
          exitConns = [(r4+1)%4, (r4+3)%4];
          outPower = Math.floor(outPower / 2);
          if (outPower < 1) continue;
        } else exitConns = [];
      } else {
        exitConns = connsOf(cell);
      }
      for (const dir of exitConns) {
        const nr = r + DIR_DELTA[dir][0];
        const nc = c + DIR_DELTA[dir][1];
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        const ncell = grid[nr][nc];
        const nconns = connsOf(ncell);
        if (!nconns.includes(OPPOSITE[dir])) continue;
        if (ncell.type === 'oneway' && OPPOSITE[dir] !== OPPOSITE[ncell.rotation]) continue;
        if (ncell.type === 'router' && OPPOSITE[dir] !== [2,3,0,1][((ncell.rotation%4)+4)%4]) continue;
        if (ncell.type === 'splitter' && OPPOSITE[dir] !== ((ncell.rotation%4)+4)%4) continue;
        if (ncell.type === 'source') continue;
        if (ncell.type === 'fuse' && outPower > (ncell.limit || 2)) continue; // fuse blows
        const nKey = `${nr},${nc},${OPPOSITE[dir]}`;
        const prev = stateMax.get(nKey) || 0;
        if (outPower > prev) {
          stateMax.set(nKey, outPower);
          if (outPower > levelMask[nr][nc]) levelMask[nr][nc] = outPower;
          pq.push([outPower, nr, nc, OPPOSITE[dir]]);
        }
      }
    }
  }

  // Iterate: opening a gate may light a switch which opens more gates
  for (let iter = 0; iter < 20; iter++) {
    for (const k in byColor) delete byColor[k];
    for (const src of sources) {
      if (!byColor[src.color]) byColor[src.color] = emptyMask();
      bfsFrom(src, byColor[src.color]);
    }
    let changed = false;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].type === 'switch') {
          const id = grid[r][c].linkId;
          const lit = Object.values(byColor).some(m => m[r][c]);
          if (!!switchLit[id] !== !!lit) { switchLit[id] = lit; changed = true; }
        }
      }
    }
    if (!changed) break;
  }
  const gateOpen = {}; // linkId -> bool (for UI: gate passable)
  for (const id in switchLit) gateOpen[id] = switchLit[id];

  // Combined: powered[r][c] = color string ('cyan'/'red'/'yellow') or 'mixed' or null
  // levels[r][c] = max power level across all colors (int >= 0)
  const powered = Array.from({length: rows}, () => new Array(cols).fill(null));
  const levels = Array.from({length: rows}, () => new Array(cols).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      for (const color in byColor) {
        if (byColor[color][r][c]) {
          powered[r][c] = powered[r][c] ? (powered[r][c] === color ? color : 'mixed') : color;
          if (byColor[color][r][c] > levels[r][c]) levels[r][c] = byColor[color][r][c];
        }
      }
    }
  }

  // depths[r][c] = hop count from nearest source via powered wires (-1 if unpowered)
  const depths = Array.from({length: rows}, () => new Array(cols).fill(-1));
  const dq = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (grid[r][c].type === 'source') { depths[r][c] = 0; dq.push([r, c, -1]); }
  while (dq.length) {
    const [r, c, entryDir] = dq.shift();
    const cell = grid[r][c];
    let exitConns;
    if (cell.type === 'oneway') {
      exitConns = (entryDir === OPPOSITE[cell.rotation] || entryDir === -1) ? [cell.rotation] : [];
    } else if (cell.type === 'bridge' && entryDir !== -1) {
      exitConns = [OPPOSITE[entryDir]];
    } else if (cell.type === 'mirror') {
      if (entryDir === -1) exitConns = [];
      else exitConns = [cell.rotation % 2 === 0 ? (entryDir ^ 3) : (entryDir ^ 1)];
    } else if (cell.type === 'router') {
      const r4 = ((cell.rotation % 4) + 4) % 4;
      const inputDir = [2,3,0,1][r4];
      if (entryDir === inputDir || entryDir === -1) {
        exitConns = [(cell.state || 0) === 0 ? [1,2,3,0][r4] : [3,0,1,2][r4]];
      } else exitConns = [];
    } else if (cell.type === 'splitter') {
      const r4 = ((cell.rotation % 4) + 4) % 4;
      if (entryDir === r4 || entryDir === -1) exitConns = [(r4+1)%4, (r4+3)%4];
      else exitConns = [];
    } else {
      exitConns = connsOf(cell);
    }
    for (const dir of exitConns) {
      const nr = r + DIR_DELTA[dir][0];
      const nc = c + DIR_DELTA[dir][1];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const ncell = grid[nr][nc];
      const nconns = connsOf(ncell);
      if (!nconns.includes(OPPOSITE[dir])) continue;
      if (ncell.type === 'oneway' && OPPOSITE[dir] !== OPPOSITE[ncell.rotation]) continue;
      if (ncell.type === 'router' && OPPOSITE[dir] !== [2,3,0,1][((ncell.rotation%4)+4)%4]) continue;
      if (ncell.type === 'splitter' && OPPOSITE[dir] !== ((ncell.rotation%4)+4)%4) continue;
      if (ncell.type === 'source') continue;
      if (depths[nr][nc] >= 0) continue;
      if (!levels[nr][nc]) continue;
      depths[nr][nc] = depths[r][c] + 1;
      dq.push([nr, nc, OPPOSITE[dir]]);
    }
  }

  return { powered, byColor, gateOpen, levels, depths };
}

function isSolved(grid, byColor) {
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[0].length; c++) {
      const cell = grid[r][c];
      if (cell.type === 'bulb') {
        const want = cell.color || 'cyan';
        if (!byColor[want] || !byColor[want][r][c]) return false;
      } else if (cell.type === 'trap') {
        // Trap: must NOT be powered
        for (const col in byColor) if (byColor[col][r][c]) return false;
      }
    }
  }
  return true;
}

const S = 72;
const H = S / 2;
const W_THICK = 10;
const ENDPOINTS = [[H,0],[S,H],[H,S],[0,H]]; // N E S W

function PieceSVG({ type, rotation, isPowered, isBulbLit, isLocked, size = S, powerColor, cellColor, isOpen, linkLabel, level = 0, state = 0 }) {
  if (type === 'empty') return null;

  const skinCtx = React.useContext(SkinContext);
  const skin = (skinCtx && skinCtx.wire) || WIRE_SKINS[0];
  const mirrorShape = (skinCtx && skinCtx.mirror) || 'default';
  const portalShape = (skinCtx && skinCtx.portal) || 'default';
  const sourceShape = (skinCtx && skinCtx.source) || 'default';
  const bulbShape   = (skinCtx && skinCtx.bulb)   || 'default';
  const gateShape   = (skinCtx && skinCtx.gate)   || 'default';
  const switchShape = (skinCtx && skinCtx.switch) || 'default';
  const fuseShape   = (skinCtx && skinCtx.fuse)   || 'default';
  const gearShape   = (skinCtx && skinCtx.gear)   || 'default';
  // Only the default (cyan) color is skinned; non-default colors (red/yellow) keep their puzzle semantics
  const cc = cellColor || 'cyan';
  const pc = powerColor || 'cyan';
  const useSkin = (pc === 'cyan');
  const useSkinOff = (cc === 'cyan');
  const liveHex = useSkin    ? skin.on  : (COLOR_HEX[pc] || COLOR_HEX.cyan);
  const offHex  = useSkinOff ? skin.off : COLOR_OFF[cc];
  const glowHex = useSkin    ? (skin.glow || liveHex) : liveHex;
  const color = isPowered ? liveHex : offHex;
  const glowStyle = isPowered
    ? { filter: `drop-shadow(0 0 4px ${glowHex}) drop-shadow(0 0 8px ${glowHex}88)` }
    : undefined;

  const conns = getConnections(type, rotation);
  const parts = [];

  if (type === 'source') {
    const ownHex = useSkinOff ? skin.on : COLOR_HEX[cc];
    const ownOff = useSkinOff ? skin.off : COLOR_OFF[cc];
    const c = isPowered ? ownHex : ownOff;
    const wireConns = conns.map(d => {
      const [ex,ey] = ENDPOINTS[d];
      return <line key={d} x1={H} y1={H} x2={ex} y2={ey} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>;
    });
    let bodyEl;
    if (sourceShape === 'dynamo') {
      // Dynamo: circle with rotor spokes
      bodyEl = (
        <g>
          <circle cx={H} cy={H} r={13} fill="none" stroke={c} strokeWidth={2.5}/>
          {[0, 60, 120, 180, 240, 300].map(deg => {
            const a = deg * Math.PI / 180;
            const x1 = H + Math.cos(a) * 4, y1 = H + Math.sin(a) * 4;
            const x2 = H + Math.cos(a) * 11, y2 = H + Math.sin(a) * 11;
            return <line key={deg} x1={x1} y1={y1} x2={x2} y2={y2} stroke={c} strokeWidth={2}/>;
          })}
          <circle cx={H} cy={H} r={3} fill={c}/>
        </g>
      );
    } else if (sourceShape === 'solar') {
      // Solar panel: square with 3x3 grid lines
      const sz = 22;
      bodyEl = (
        <g>
          <rect x={H-sz/2} y={H-sz/2} width={sz} height={sz} rx={2} fill={isPowered ? `${c}22` : 'none'} stroke={c} strokeWidth={2}/>
          <line x1={H-sz/2} y1={H-sz/6} x2={H+sz/2} y2={H-sz/6} stroke={c} strokeWidth={1}/>
          <line x1={H-sz/2} y1={H+sz/6} x2={H+sz/2} y2={H+sz/6} stroke={c} strokeWidth={1}/>
          <line x1={H-sz/6} y1={H-sz/2} x2={H-sz/6} y2={H+sz/2} stroke={c} strokeWidth={1}/>
          <line x1={H+sz/6} y1={H-sz/2} x2={H+sz/6} y2={H+sz/2} stroke={c} strokeWidth={1}/>
        </g>
      );
    } else {
      // Default: battery rectangle
      bodyEl = (
        <g>
          <rect x={H-14} y={H-10} width={28} height={20} rx={4} fill="none" stroke={c} strokeWidth={2.5}/>
          <rect x={H+14} y={H-5} width={4} height={10} rx={1} fill={c}/>
          <line x1={H-6} y1={H} x2={H+6} y2={H} stroke={c} strokeWidth={2.5}/>
          <line x1={H} y1={H-6} x2={H} y2={H+6} stroke={c} strokeWidth={2.5}/>
        </g>
      );
    }
    parts.push(
      <g key="src" style={isPowered ? { filter: `drop-shadow(0 0 4px ${ownHex}) drop-shadow(0 0 8px ${ownHex}88)` } : undefined}>
        {bodyEl}
        {wireConns}
      </g>
    );
  } else if (type === 'bulb') {
    const ownHex = useSkinOff ? skin.on : COLOR_HEX[cc];
    const ownOff = useSkinOff ? skin.off : COLOR_OFF[cc];
    const litHex = cc === 'red' ? '#ff8888' : cc === 'yellow' ? '#ffee66' : '#ffee44';
    const c = isBulbLit ? litHex : isPowered ? ownHex : ownOff;
    const style = isBulbLit
      ? { filter: `drop-shadow(0 0 8px ${litHex}) drop-shadow(0 0 16px ${ownHex})` }
      : isPowered
        ? { filter: `drop-shadow(0 0 4px ${ownHex})` }
        : undefined;
    const wireConns = conns.map(d => {
      const [ex,ey] = ENDPOINTS[d];
      return <line key={d} x1={H} y1={H} x2={ex} y2={ey} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>;
    });
    let bodyEl;
    if (bulbShape === 'edison') {
      // Edison bulb: classic teardrop with filament zigzag
      const bulbColor = isBulbLit ? `${litHex}55` : 'none';
      bodyEl = (
        <g>
          {isBulbLit && <ellipse cx={H} cy={H-2} rx={20} ry={22} fill={`${litHex}22`}/>}
          <path d={`M ${H-9} ${H+5} Q ${H-13} ${H-12} ${H} ${H-14} Q ${H+13} ${H-12} ${H+9} ${H+5} L ${H+9} ${H+8} L ${H-9} ${H+8} Z`}
            fill={bulbColor} stroke={c} strokeWidth={2} strokeLinejoin="round"/>
          {/* filament */}
          <path d={`M ${H-5} ${H-2} L ${H-3} ${H-6} L ${H} ${H-2} L ${H+3} ${H-6} L ${H+5} ${H-2}`}
            stroke={c} strokeWidth={1.5} fill="none" strokeLinecap="round"/>
          {/* base */}
          <rect x={H-7} y={H+8} width={14} height={4} fill={c} rx={1}/>
          <rect x={H-5} y={H+12} width={10} height={2} fill={c}/>
        </g>
      );
    } else if (bulbShape === 'led') {
      // LED: square SMD package with center die
      bodyEl = (
        <g>
          {isBulbLit && <rect x={H-18} y={H-18} width={36} height={36} fill={`${litHex}22`} rx={3}/>}
          <rect x={H-12} y={H-9} width={24} height={18} rx={2} fill={isBulbLit ? `${litHex}55` : 'none'} stroke={c} strokeWidth={2}/>
          {/* die */}
          <rect x={H-5} y={H-3} width={10} height={7} fill={c} rx={1}/>
          {/* indicator dot */}
          <circle cx={H-9} cy={H+6} r={1.5} fill={c}/>
          {/* legs */}
          <line x1={H-9} y1={H+9} x2={H-9} y2={H+13} stroke={c} strokeWidth={1.5}/>
          <line x1={H+9} y1={H+9} x2={H+9} y2={H+13} stroke={c} strokeWidth={1.5}/>
        </g>
      );
    } else {
      // Default
      bodyEl = (
        <g>
          {isBulbLit && <circle cx={H} cy={H} r={18} fill={`${litHex}33`}/>}
          <circle cx={H} cy={H} r={12} fill="none" stroke={c} strokeWidth={2.5}/>
          <path d={`M${H-5},${H+8} L${H+5},${H+8}`} stroke={c} strokeWidth={2} strokeLinecap="round"/>
        </g>
      );
    }
    parts.push(
      <g key="bulb" style={style}>
        {bodyEl}
        {wireConns}
      </g>
    );
  } else if (type === 'bridge') {
    const c = isPowered ? liveHex : (useSkinOff ? skin.off : '#2a3a5a');
    const bg = isPowered ? '#0a1a2a' : '#111827';
    parts.push(
      <g key="bridge" style={glowStyle}>
        <line x1={0} y1={H} x2={S} y2={H} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>
        <rect x={H-7} y={H-7} width={14} height={14} fill={bg}/>
        <line x1={H} y1={0} x2={H} y2={S} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>
      </g>
    );
  } else if (type === 'mirror') {
    // / (rot even): pairs {N,W} & {S,E}. Diagonal goes bottom-left → top-right.
    // \ (rot odd):  pairs {N,E} & {S,W}. Diagonal goes top-left → bottom-right.
    const m = rotation % 2;
    // Wires: each reflection pair drawn as a smooth quadratic curve
    // bending toward the mirror surface (away from the mirror's "back" side).
    // For /: pairs {N,W} (curve through top-left) and {S,E} (curve through bottom-right).
    // For \: pairs {N,E} (curve through top-right) and {S,W} (curve through bottom-left).
    const surfaceColor = isPowered ? '#ffffff' : '#a8c0d8';
    const mirX1 = m === 0 ? 6 : 6;
    const mirY1 = m === 0 ? S-6 : 6;
    const mirX2 = m === 0 ? S-6 : S-6;
    const mirY2 = m === 0 ? 6 : S-6;
    // Bend control points placed at the corners adjacent to each reflection pair.
    // /: pair1 NW corner, pair2 SE corner.  \: pair1 NE corner, pair2 SW corner.
    const bend = 14;
    const pair1Corner = m === 0 ? [bend, bend]       : [S-bend, bend];     // / → NW, \ → NE
    const pair2Corner = m === 0 ? [S-bend, S-bend]   : [bend, S-bend];     // / → SE, \ → SW
    const pair1Ends = m === 0 ? [ENDPOINTS[0], ENDPOINTS[3]] : [ENDPOINTS[0], ENDPOINTS[1]]; // /:{N,W} \:{N,E}
    const pair2Ends = m === 0 ? [ENDPOINTS[2], ENDPOINTS[1]] : [ENDPOINTS[2], ENDPOINTS[3]]; // /:{S,E} \:{S,W}
    const path1 = `M ${pair1Ends[0][0]} ${pair1Ends[0][1]} Q ${pair1Corner[0]} ${pair1Corner[1]} ${pair1Ends[1][0]} ${pair1Ends[1][1]}`;
    const path2 = `M ${pair2Ends[0][0]} ${pair2Ends[0][1]} Q ${pair2Corner[0]} ${pair2Corner[1]} ${pair2Ends[1][0]} ${pair2Ends[1][1]}`;
    // Mirror surface variants: default (line), jewel (faceted gem), prism (triangular)
    let surfaceEl;
    if (mirrorShape === 'jewel') {
      // Diamond gem along the diagonal: 4 facet polygons at the center
      const cx = H, cy = H;
      const dx = mirX2 - mirX1, dy = mirY2 - mirY1;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const ux = dx/len, uy = dy/len;       // along mirror
      const nx = -uy, ny = ux;              // perpendicular
      const long = 18, narrow = 9;
      const p1 = [cx - ux*long, cy - uy*long];
      const p2 = [cx + nx*narrow, cy + ny*narrow];
      const p3 = [cx + ux*long, cy + uy*long];
      const p4 = [cx - nx*narrow, cy - ny*narrow];
      surfaceEl = (
        <g>
          <polygon points={`${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${p3[0]},${p3[1]} ${p4[0]},${p4[1]}`}
            fill={isPowered ? `${surfaceColor}55` : '#0a0e1a'} stroke={surfaceColor} strokeWidth={2.2} strokeLinejoin="round"/>
          <line x1={p1[0]} y1={p1[1]} x2={p3[0]} y2={p3[1]} stroke={surfaceColor} strokeWidth={1.2} opacity={0.85}/>
          <line x1={p2[0]} y1={p2[1]} x2={p4[0]} y2={p4[1]} stroke={surfaceColor} strokeWidth={1.2} opacity={0.85}/>
        </g>
      );
    } else if (mirrorShape === 'prism') {
      // Triangular prism: triangle pointing perpendicular to the mirror diagonal
      const cx = H, cy = H;
      const dx = mirX2 - mirX1, dy = mirY2 - mirY1;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const ux = dx/len, uy = dy/len;
      const nx = -uy, ny = ux;
      const base = 20, height = 14;
      const pA = [cx - ux*base + nx*4, cy - uy*base + ny*4];
      const pB = [cx + ux*base + nx*4, cy + uy*base + ny*4];
      const pC = [cx - nx*height, cy - ny*height];
      const grad = isPowered ? '#fff5d0' : '#7ddfff';
      surfaceEl = (
        <g>
          <polygon points={`${pA[0]},${pA[1]} ${pB[0]},${pB[1]} ${pC[0]},${pC[1]}`}
            fill={isPowered ? `${grad}33` : '#0a0e1a'} stroke={surfaceColor} strokeWidth={2.2} strokeLinejoin="round"/>
          <line x1={pA[0]} y1={pA[1]} x2={pB[0]} y2={pB[1]} stroke={surfaceColor} strokeWidth={3} strokeLinecap="round"/>
          {/* rainbow streak across the prism */}
          {isPowered && (
            <line x1={pA[0]} y1={pA[1]} x2={pC[0]} y2={pC[1]} stroke="#ff66cc" strokeWidth={1.2} opacity={0.7}/>
          )}
        </g>
      );
    } else {
      // Default: simple line surface
      surfaceEl = (
        <g>
          <line x1={mirX1} y1={mirY1} x2={mirX2} y2={mirY2} stroke={surfaceColor} strokeWidth={7} strokeLinecap="round" opacity={0.35}/>
          <line x1={mirX1} y1={mirY1} x2={mirX2} y2={mirY2} stroke={surfaceColor} strokeWidth={3.5} strokeLinecap="round"/>
        </g>
      );
    }
    parts.push(
      <g key="mirror" style={glowStyle}>
        <path d={path1} stroke={color} strokeWidth={W_THICK} fill="none" strokeLinecap="round"/>
        <path d={path2} stroke={color} strokeWidth={W_THICK} fill="none" strokeLinecap="round"/>
        {surfaceEl}
      </g>
    );
  } else if (type === 'oneway') {
    // Wire from input to output, with arrow indicating output direction
    const inDir = OPPOSITE[((rotation%4)+4)%4];
    const outDir = ((rotation%4)+4)%4;
    const [ix, iy] = ENDPOINTS[inDir];
    const [ox, oy] = ENDPOINTS[outDir];
    // Arrow tip at endpoint of output, base 16px back toward center
    const tipX = (H + ox) / 2 + (ox - H) * 0.25;
    const tipY = (H + oy) / 2 + (oy - H) * 0.25;
    // Compute perpendicular for the base
    const dx = ox - H, dy = oy - H;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx / len, uy = dy / len;
    const px = -uy, py = ux; // perpendicular
    const baseCx = tipX - ux * 14;
    const baseCy = tipY - uy * 14;
    const b1x = baseCx + px * 9, b1y = baseCy + py * 9;
    const b2x = baseCx - px * 9, b2y = baseCy - py * 9;
    parts.push(
      <g key="oneway" style={glowStyle}>
        <line x1={ix} y1={iy} x2={ox} y2={oy} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        <polygon points={`${tipX},${tipY} ${b1x},${b1y} ${b2x},${b2y}`} fill={color} stroke={color} strokeWidth={1.5} strokeLinejoin="round"/>
      </g>
    );
  } else if (type === 'switch') {
    const c = color;
    const wires = [0,1,2,3].map(d => {
      const [ex,ey] = ENDPOINTS[d];
      return <line key={d} x1={H} y1={H} x2={ex} y2={ey} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>;
    });
    let bodyEl;
    if (switchShape === 'knob') {
      // Rotary knob: outer ring + tick mark + center dot
      bodyEl = (
        <g>
          <circle cx={H} cy={H} r={14} fill={isPowered ? c : '#0d1225'} stroke={c} strokeWidth={2.5}/>
          <circle cx={H} cy={H} r={11} fill="none" stroke={isPowered ? '#0d1225' : c} strokeWidth={1.3} opacity={0.7}/>
          {/* tick (always points up to indicate position) */}
          <line x1={H} y1={H-12} x2={H} y2={H-5} stroke={isPowered ? '#0d1225' : c} strokeWidth={2.5} strokeLinecap="round"/>
          <text x={H} y={H+8} textAnchor="middle" fontSize="9" fontWeight="700" fill={isPowered ? '#0d1225' : c}>{linkLabel || 'S'}</text>
        </g>
      );
    } else {
      bodyEl = (
        <g>
          <circle cx={H} cy={H} r={13} fill={isPowered ? c : '#0d1225'} stroke={c} strokeWidth={2.5}/>
          <text x={H} y={H+4} textAnchor="middle" fontSize="12" fontWeight="700" fill={isPowered ? '#0d1225' : c}>{linkLabel || 'S'}</text>
        </g>
      );
    }
    parts.push(
      <g key="switch" style={glowStyle}>
        {wires}
        {bodyEl}
      </g>
    );
  } else if (type === 'gate') {
    const c = color;
    const [a, b] = conns;
    const [ax, ay] = ENDPOINTS[a];
    const [bx, by] = ENDPOINTS[b];
    const isHoriz = (rotation % 2) === 1;
    if (isOpen) {
      parts.push(
        <g key="gate" style={glowStyle}>
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>
          <text x={H} y={H-12} textAnchor="middle" fontSize="9" fill={c}>{linkLabel || 'G'}</text>
        </g>
      );
    } else if (gateShape === 'portcullis') {
      // Portcullis: vertical bars (or horizontal if rotated)
      const bars = [];
      const len = 26;
      const barCount = 5;
      for (let i = 0; i < barCount; i++) {
        const off = -len/2 + (len / (barCount - 1)) * i;
        if (isHoriz) {
          bars.push(<line key={i} x1={H + off} y1={H-12} x2={H + off} y2={H+12} stroke="#5a6a8a" strokeWidth={1.6}/>);
        } else {
          bars.push(<line key={i} x1={H-12} y1={H + off} x2={H+12} y2={H + off} stroke="#5a6a8a" strokeWidth={1.6}/>);
        }
      }
      parts.push(
        <g key="gate-portcullis">
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke="#3a4a6a" strokeWidth={W_THICK} strokeLinecap="round" strokeDasharray="4 4" opacity="0.5"/>
          <rect
            x={isHoriz ? H-14 : H-12} y={isHoriz ? H-12 : H-14}
            width={isHoriz ? 28 : 24} height={isHoriz ? 24 : 28}
            fill="#0d1225" stroke="#5a6a8a" strokeWidth={1.5} rx={2}/>
          {bars}
          <text x={H} y={H+4} textAnchor="middle" fontSize="8" fontWeight="700" fill="#aabacc">{linkLabel || 'G'}</text>
        </g>
      );
    } else {
      // Default closed: dashed wire + barrier
      parts.push(
        <g key="gate-closed">
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke="#3a4a6a" strokeWidth={W_THICK} strokeLinecap="round" strokeDasharray="4 4" opacity="0.5"/>
          <rect
            x={isHoriz ? H-3 : H-14} y={isHoriz ? H-14 : H-3}
            width={isHoriz ? 6 : 28} height={isHoriz ? 28 : 6}
            fill="#1a2535" stroke="#5a6a8a" strokeWidth={1.5}/>
          <text x={H} y={H+4} textAnchor="middle" fontSize="9" fill="#7a8aaa">{linkLabel || 'G'}</text>
        </g>
      );
    }
  } else if (type === 'igate') {
    // Inverse gate: passable when switch UNlit (isOpen reflects passability)
    const c = color;
    const [a, b] = conns;
    const [ax, ay] = ENDPOINTS[a];
    const [bx, by] = ENDPOINTS[b];
    if (isOpen) {
      parts.push(
        <g key="igate" style={glowStyle}>
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>
          <text x={H} y={H-12} textAnchor="middle" fontSize="9" fill={c}>!{linkLabel || 'G'}</text>
        </g>
      );
    } else {
      const isHoriz = (rotation % 2) === 1;
      parts.push(
        <g key="igate-closed">
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke="#6a3a4a" strokeWidth={W_THICK} strokeLinecap="round" strokeDasharray="4 4" opacity="0.5"/>
          <rect
            x={isHoriz ? H-3 : H-14} y={isHoriz ? H-14 : H-3}
            width={isHoriz ? 6 : 28} height={isHoriz ? 28 : 6}
            fill="#2a1a25" stroke="#8a5a6a" strokeWidth={1.5}/>
          <text x={H} y={H+4} textAnchor="middle" fontSize="9" fill="#aa7a8a">!{linkLabel || 'G'}</text>
        </g>
      );
    }
  } else if (type === 'fuse') {
    const horiz = (rotation % 2) === 1;
    const c = color;
    const fuseParts = [];
    // Wires (common to all variants)
    if (horiz) {
      fuseParts.push(<line key="fw1" x1={0} y1={H} x2={H-15} y2={H} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>);
      fuseParts.push(<line key="fw2" x1={H+15} y1={H} x2={S} y2={H} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>);
    } else {
      fuseParts.push(<line key="fw1" x1={H} y1={0} x2={H} y2={H-15} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>);
      fuseParts.push(<line key="fw2" x1={H} y1={H+15} x2={H} y2={S} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>);
    }
    if (fuseShape === 'glass') {
      // Glass tube fuse: transparent body + visible zigzag filament + metal end caps
      if (horiz) {
        fuseParts.push(<rect key="fcap1" x={H-17} y={H-7} width={4} height={14} fill={c}/>);
        fuseParts.push(<rect key="fcap2" x={H+13} y={H-7} width={4} height={14} fill={c}/>);
        fuseParts.push(<rect key="ftube" x={H-13} y={H-6} width={26} height={12} fill={isPowered ? `${c}33` : 'rgba(20,30,50,0.5)'} stroke={c} strokeWidth={1.2}/>);
        // zigzag filament
        fuseParts.push(<polyline key="ffil" points={`${H-10},${H} ${H-6},${H-4} ${H-2},${H+3} ${H+2},${H-4} ${H+6},${H+3} ${H+10},${H}`}
          stroke={c} strokeWidth={1.5} fill="none"/>);
      } else {
        fuseParts.push(<rect key="fcap1" x={H-7} y={H-17} width={14} height={4} fill={c}/>);
        fuseParts.push(<rect key="fcap2" x={H-7} y={H+13} width={14} height={4} fill={c}/>);
        fuseParts.push(<rect key="ftube" x={H-6} y={H-13} width={12} height={26} fill={isPowered ? `${c}33` : 'rgba(20,30,50,0.5)'} stroke={c} strokeWidth={1.2}/>);
        fuseParts.push(<polyline key="ffil" points={`${H},${H-10} ${H-4},${H-6} ${H+3},${H-2} ${H-4},${H+2} ${H+3},${H+6} ${H},${H+10}`}
          stroke={c} strokeWidth={1.5} fill="none"/>);
      }
    } else {
      // Default capsule
      if (horiz) {
        fuseParts.push(<rect key="fcap" x={H-15} y={H-8} width={30} height={16} rx={8} fill="#0d1225" stroke={c} strokeWidth={2}/>);
        fuseParts.push(<line key="ffil" x1={H-12} y1={H} x2={H+12} y2={H} stroke={c} strokeWidth={1.5}/>);
      } else {
        fuseParts.push(<rect key="fcap" x={H-8} y={H-15} width={16} height={30} rx={8} fill="#0d1225" stroke={c} strokeWidth={2}/>);
        fuseParts.push(<line key="ffil" x1={H} y1={H-12} x2={H} y2={H+12} stroke={c} strokeWidth={1.5}/>);

    parts.push(
      <g key="fuse" style={glowStyle}>
        {fuseParts}
        <text x={H} y={H-16} textAnchor="middle" fontSize="10" fontWeight="700" fill={c}>≤{linkLabel}</text>
      </g>
    );
  } else if (type === 'portal') {
    // Single endpoint + portal body (shape variants)
    const c = color;
    const d = conns[0];
    const [ex, ey] = ENDPOINTS[d];
    let bodyEl;
    if (portalShape === 'spiral') {
      // Spiral with 1.5 turns
      const turns = 1.5, steps = 36;
      const maxR = 13;
      let path = '';
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const ang = t * turns * 2 * Math.PI;
        const r = t * maxR;
        const x = H + r * Math.cos(ang);
        const y = H + r * Math.sin(ang);
        path += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
      }
      bodyEl = (
        <g>
          <circle cx={H} cy={H} r={15} fill="none" stroke={c} strokeWidth={1.8} opacity={0.4}/>

          <text x={H} y={H+18} textAnchor="middle" fontSize="9" fontWeight="700" fill={c}>{linkLabel}</text>
        </g>
      );
    } else if (portalShape === 'crystal') {
      // Hexagonal crystal portal
      const R = 15;
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 3;
        pts.push([H + R * Math.cos(a), H + R * Math.sin(a)]);
      }
      const polyStr = pts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
      const innerR = 6;
      const innerPts = [];
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 3;
        innerPts.push([H + innerR * Math.cos(a), H + innerR * Math.sin(a)]);

      const innerStr = innerPts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
      bodyEl = (
        <g>
          <polygon points={polyStr} fill={isPowered ? `${c}22` : 'none'} stroke={c} strokeWidth={2.4} strokeLinejoin="round"/>
          <polygon points={innerStr} fill="none" stroke={c} strokeWidth={1.4} opacity={0.7}/>
          {/* facet lines */}
          {[0,1,2].map(i => {
            const a1 = -Math.PI / 2 + i * Math.PI / 3;
            const a2 = a1 + Math.PI;
            return <line key={i} x1={H + R*Math.cos(a1)} y1={H + R*Math.sin(a1)} x2={H + R*Math.cos(a2)} y2={H + R*Math.sin(a2)} stroke={c} strokeWidth={0.8} opacity={0.4}/>;
          })}
          <text x={H} y={H+4} textAnchor="middle" fontSize="10" fontWeight="700" fill={c}>{linkLabel}</text>
        </g>
      );
    } else {
      // Default: concentric ring portal
      bodyEl = (
        <g>
          <circle cx={H} cy={H} r={14} fill="none" stroke={c} strokeWidth={2.5}/>
          <circle cx={H} cy={H} r={9} fill="none" stroke={c} strokeWidth={1.5} opacity={0.6}/>
          <text x={H} y={H+4} textAnchor="middle" fontSize="11" fontWeight="700" fill={c}>{linkLabel}</text>
        </g>
      );
    }
    parts.push(
      <g key="portal" style={glowStyle}>
        <line x1={H} y1={H} x2={ex} y2={ey} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>
        {bodyEl}
      </g>
    );
  } else if (type === 'router') {
    // T-shape: input wire + active arm (solid) + inactive arm (dashed/dim)
    const r4 = ((rotation % 4) + 4) % 4;
    const inputDir = [2,3,0,1][r4];
    const armCW    = [1,2,3,0][r4];
    const armCCW   = [3,0,1,2][r4];
    const activeArm   = state === 0 ? armCW : armCCW;
    const inactiveArm = state === 0 ? armCCW : armCW;
    const dimColor = isPowered ? `${liveHex}33` : '#2a3a5a';
    const [inx, iny] = ENDPOINTS[inputDir];
    const [ax2, ay2] = ENDPOINTS[activeArm];
    const [ix2, iy2] = ENDPOINTS[inactiveArm];
    // Arrow on active arm
    const adx = ax2-H, ady = ay2-H, alen = Math.sqrt(adx*adx+ady*ady)||1;
    const aux = adx/alen, auy = ady/alen, apx = -auy, apy = aux;
    const tipD = 20, baseBack = 11, baseW = 7;
    const tx = H+aux*tipD, ty = H+auy*tipD;
    const bx2 = tx-aux*baseBack, by2 = ty-auy*baseBack;
    parts.push(
      <g key="router" style={glowStyle}>
        <line x1={inx} y1={iny} x2={H} y2={H} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        <line x1={H} y1={H} x2={ax2} y2={ay2} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        <line x1={H} y1={H} x2={ix2} y2={iy2} stroke={dimColor} strokeWidth={W_THICK} strokeLinecap="round" strokeDasharray="5 5"/>
        <circle cx={H} cy={H} r={W_THICK/2} fill={color}/>
        <polygon points={`${tx},${ty} ${bx2+apx*baseW},${by2+apy*baseW} ${bx2-apx*baseW},${by2-apy*baseW}`} fill={color}/>
      </g>
    );
  } else if (type === 'resistor' || type === 'amp' || type === 'resistorL' || type === 'ampL') {
    // Circuit-diagram style: wire + center symbol
    const isL = (type === 'resistorL' || type === 'ampL');
    const isAmp = (type === 'amp' || type === 'ampL');
    // Symbol center position
    let sx = H, sy = H;
    const wireParts = [];
    if (isL) {
      for (const d of conns) {
        const [ex,ey] = ENDPOINTS[d];
        wireParts.push(
          <line key={`lw${d}`} x1={H} y1={H} x2={ex} y2={ey}
            stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        );
      }
      // Symbol at center
      sx = H; sy = H;
    } else {
      const horiz = (rotation % 2) === 1;
      if (horiz) {
        wireParts.push(<line key="w1" x1={0} y1={H} x2={H-16} y2={H} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>);
        wireParts.push(<line key="w2" x1={H+16} y1={H} x2={S} y2={H} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>);
      } else {
        wireParts.push(<line key="w1" x1={H} y1={0} x2={H} y2={H-16} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>);
        wireParts.push(<line key="w2" x1={H} y1={H+16} x2={H} y2={S} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>);
      }
    }
    // Symbol
    let symbol;
    if (isAmp) {
      // Op-amp style triangle pointing along longer wire (default: right)
      symbol = (
        <g key="amp-sym">
          <circle cx={sx} cy={sy} r={13} fill="#0d1225" stroke={color} strokeWidth={2}/>
          <polygon points={`${sx-6},${sy-7} ${sx+8},${sy} ${sx-6},${sy+7}`} fill="none" stroke={color} strokeWidth={2.2} strokeLinejoin="round"/>
        </g>
      );
    } else {
      symbol = (
        <g key="res-sym">
          <rect x={sx-13} y={sy-7} width={26} height={14} rx={3} fill="#0d1225" stroke={color} strokeWidth={2}/>
          <path d={`M ${sx-10} ${sy} L ${sx-7} ${sy-4} L ${sx-3} ${sy+4} L ${sx+1} ${sy-4} L ${sx+5} ${sy+4} L ${sx+8} ${sy-4} L ${sx+10} ${sy}`}
            stroke={color} fill="none" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"/>
        </g>
      );
    }
    parts.push(<g key="rwire" style={glowStyle}>{wireParts}{symbol}</g>);
  } else if (type === 'gear') {
    const wireParts = [];
    for (const d of conns) {
      const [ex, ey] = ENDPOINTS[d];
      wireParts.push(<line key={`gw${d}`} x1={H} y1={H} x2={ex} y2={ey} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>);
    }
    const RING_R = 11;
    const TOOTH_OUT = 16;
    let gearEl;
    if (gearShape === 'sprocket') {
      // Sprocket: 12 triangular teeth, smaller central hole
      const teeth = [];
      const teethCount = 12;
      for (let i = 0; i < teethCount; i++) {
        const a = (i / teethCount) * 2 * Math.PI - Math.PI / 2;
        const xT = H + Math.cos(a) * TOOTH_OUT;
        const yT = H + Math.sin(a) * TOOTH_OUT;
        const a1 = a - (Math.PI / teethCount) * 0.5;
        const a2 = a + (Math.PI / teethCount) * 0.5;
        const x1 = H + Math.cos(a1) * RING_R;
        const y1 = H + Math.sin(a1) * RING_R;
        const x2 = H + Math.cos(a2) * RING_R;
        const y2 = H + Math.sin(a2) * RING_R;
        teeth.push(<polygon key={`tk${i}`} points={`${xT},${yT} ${x1},${y1} ${x2},${y2}`} fill={color}/>);
      }
      gearEl = (
        <g>
          <circle cx={H} cy={H} r={RING_R} fill="#0d1225" stroke={color} strokeWidth={2}/>
          {teeth}
          <circle cx={H} cy={H} r={5} fill="#0d1225" stroke={color} strokeWidth={1.5}/>
        </g>
      );
    } else {
      const teeth = [];
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * 2 * Math.PI - Math.PI / 2;
        const x1 = H + Math.cos(a) * RING_R;
        const y1 = H + Math.sin(a) * RING_R;
        const x2 = H + Math.cos(a) * TOOTH_OUT;
        const y2 = H + Math.sin(a) * TOOTH_OUT;
        teeth.push(<line key={`tooth${i}`} x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth={3.5} strokeLinecap="round"/>);
      }
      gearEl = (
        <g>
          <circle cx={H} cy={H} r={RING_R} fill="#0d1225" stroke={color} strokeWidth={2.5}/>

          <circle cx={H} cy={H} r={3} fill={color}/>
        </g>
      );
    }
    parts.push(
      <g key="gear" style={glowStyle}>
        {wireParts}
        {gearEl}
      </g>
    );
  } else if (type === 'splitter') {

    const [ix, iy] = ENDPOINTS[inputDir];
    const [o1x, o1y] = ENDPOINTS[out1];
    const [o2x, o2y] = ENDPOINTS[out2];
    // input arrow (toward center)
    const dx = H - ix, dy = H - iy;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx / len, uy = dy / len;
    const px = -uy, py = ux;
    const tipD = 22, baseBack = 8, baseW = 5;
    const tx = ix + ux*tipD, ty = iy + uy*tipD;
    const bx = tx - ux*baseBack, by = ty - uy*baseBack;
    parts.push(
      <g key="splitter" style={glowStyle}>
        <line x1={ix} y1={iy} x2={H} y2={H} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        <line x1={H} y1={H} x2={o1x} y2={o1y} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        <line x1={H} y1={H} x2={o2x} y2={o2y} stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
        <circle cx={H} cy={H} r={W_THICK/2} fill={color}/>
        {/* Input arrow */}
        <polygon points={`${tx},${ty} ${bx+px*baseW},${by+py*baseW} ${bx-px*baseW},${by-py*baseW}`} fill={color} opacity={0.85}/>

        <text x={H} y={H-13} textAnchor="middle" fontSize="9" fontWeight="800" fill={color} opacity={0.9}>÷2</text>
      </g>
    );
  } else if (type === 'andgate') {
    // Straight gate w/ ampersand label, opens when ALL linked switches lit
    const c = color;
    const [a, b] = conns;
    const [ax, ay] = ENDPOINTS[a];
    const [bx, by] = ENDPOINTS[b];
    const isHoriz = (rotation % 2) === 1;
    if (isOpen) {
      parts.push(
        <g key="andgate" style={glowStyle}>
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke={c} strokeWidth={W_THICK} strokeLinecap="round"/>

        </g>
      );
    } else {
      parts.push(
        <g key="andgate-closed">
          <line x1={ax} y1={ay} x2={bx} y2={by} stroke="#3a4a6a" strokeWidth={W_THICK} strokeLinecap="round" strokeDasharray="4 4" opacity="0.5"/>
          <rect
            x={isHoriz ? H-3 : H-14} y={isHoriz ? H-14 : H-3}
            width={isHoriz ? 6 : 28} height={isHoriz ? 28 : 6}
            fill="#1a2535" stroke="#5a8aaa" strokeWidth={1.5}/>
          <text x={H} y={H+4} textAnchor="middle" fontSize="9" fontWeight="800" fill="#8aaace">{linkLabel}</text>
        </g>
      );
    }
  } else if (type === 'trap') {
    // 4-way wire + warning X overlay (red if powered = bad state)
    const trapColor = isPowered ? '#ff4055' : '#cc3344';
    const wireColor = isPowered ? '#ff4055' : color;
    const wires = [];
    for (const d of [0,1,2,3]) {
      const [ex, ey] = ENDPOINTS[d];
      wires.push(<line key={`tw${d}`} x1={H} y1={H} x2={ex} y2={ey} stroke={wireColor} strokeWidth={W_THICK} strokeLinecap="round"/>);
    }
    parts.push(
      <g key="trap" style={isPowered ? { filter: `drop-shadow(0 0 6px ${trapColor})` } : undefined}>
        {wires}
        {/* Danger background */}
        <circle cx={H} cy={H} r={14} fill={isPowered ? `${trapColor}55` : '#1a0a0e'} stroke={trapColor} strokeWidth={2.2}/>
        {/* X mark */}
        <line x1={H-7} y1={H-7} x2={H+7} y2={H+7} stroke={trapColor} strokeWidth={3} strokeLinecap="round"/>
        <line x1={H-7} y1={H+7} x2={H+7} y2={H-7} stroke={trapColor} strokeWidth={3} strokeLinecap="round"/>
      </g>
    );
  } else {
    // Generic wire pieces (straight, l, t, cross)
    const paths = [];
    for (const d of conns) {
      const [ex,ey] = ENDPOINTS[d];
      paths.push(
        <line key={d} x1={H} y1={H} x2={ex} y2={ey}
          stroke={color} strokeWidth={W_THICK} strokeLinecap="round"/>
      );
    }
    if (conns.length > 1) {
      paths.push(<circle key="dot" cx={H} cy={H} r={W_THICK/2} fill={color}/>);
    }
    parts.push(<g key="wire" style={glowStyle}>{paths}</g>);
  }

  return (
    <svg width={size} height={size} viewBox={`0 0 ${S} ${S}`}>
      {parts}
      {isLocked && (
        <g>
          <rect x={S-18} y={3} width={14} height={10} rx={2} fill="#0d1225" stroke="#4a6a8a" strokeWidth={1.2}/>
          <path d={`M${S-15},3 a4,3.5 0 0,1 8,0`} fill="none" stroke="#4a6a8a" strokeWidth={1.5}/>
          <circle cx={S-11} cy={8} r={1.5} fill="#4a6a8a"/>
        </g>
      )}
      {level > 0 && (type === 'source' || type === 'bulb' || type === 'resistor' || type === 'amp' || type === 'resistorL' || type === 'ampL') && (
        <g>
          <rect x={3} y={S-15} width={14} height={12} rx={3} fill="#0d1225" stroke={COLOR_HEX[powerColor] || COLOR_HEX.cyan} strokeWidth={1.2}/>
          <text x={10} y={S-6} textAnchor="middle" fontSize="10" fontWeight="700" fill={COLOR_HEX[powerColor] || COLOR_HEX.cyan}>{level}</text>
        </g>
      )}
    </svg>
  );
}
