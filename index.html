// ─── Stars ───────────────────────────────────────────────────────────────────
function calcStars(moves, minMoves, hintUsed) {
  if (hintUsed) return 1;
  if (moves <= minMoves) return 3;
  if (moves <= minMoves * 1.5) return 2;
  return 1;
}

// ─── Game Screen ─────────────────────────────────────────────────────────────
function GameScreen({ stageIdx, customStage, stageKey, onBack, onNext, onStageSelect, bestStars, setBestStars, bestMoves, setBestMoves, taMode, bestTimes, setBestTimes, availableStars, onSpendStars, challengeMode, onChallengeClear }) {
  const stage = customStage || STAGES[stageIdx];
  const saveKey = stageKey !== undefined ? stageKey : (stageIdx != null ? `stage_${stageIdx}` : null);
  const taActive = !!taMode && !!saveKey && !challengeMode; // TA needs a saveKey (skip editor test play, challenge mode has its own timer)
  const HINT_LIGHT_COST = 1;
  const HINT_FULL_COST = 3;

  const [grid, setGrid] = useState(() =>
    stage.grid.map(row => row.map(cell => ({ ...cell })))
  );
  const [moves, setMoves] = useState(0);
  const [hintUsed, setHintUsed] = useState(false);
  const [cleared, setCleared] = useState(false);
  const [stars, setStars] = useState(0);
  const [rotatingCells, setRotatingCells] = useState(() => new Map()); // "r-c" -> cw
  const [history, setHistory] = useState([]); // stack of { grid, moves[, bin] } snapshots
  const [isNewBest, setIsNewBest] = useState(false);

  // ── Parts-bin (placement) mode ──
  const [bin, setBin] = useState(() => (stage.inventory ? { ...stage.inventory } : {}));
  const [selectedPiece, setSelectedPiece] = useState(null);
  // Which empty cells are placeable slots (derived from the original stage grid + solutionTypes)
  const slotMask = React.useMemo(() => {
    if (!stage.partsBin) return null;
    return stage.grid.map((row, r) => row.map((cell, c) =>
      cell.type === 'empty' && !!(stage.solutionTypes && stage.solutionTypes[r] && stage.solutionTypes[r][c])
    ));
  }, [stage]);

  // Time attack: start on first interaction, stop on clear
  const [startTime, setStartTime] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);
  const [finalMs, setFinalMs] = useState(0);
  const [isNewBestTime, setIsNewBestTime] = useState(false);
  useEffect(() => {
    if (!taActive || startTime == null || cleared) return;
    const id = setInterval(() => setElapsedMs(Date.now() - startTime), 73);
    return () => clearInterval(id);
  }, [taActive, startTime, cleared]);
  const fmtMs = (ms) => {
    const t = Math.max(0, Math.floor(ms));
    const cs = Math.floor((t % 1000) / 10).toString().padStart(2, '0');
    const s = Math.floor(t / 1000) % 60;
    const m = Math.floor(t / 60000);
    return `${m}:${s.toString().padStart(2, '0')}.${cs}`;
  };
  const tutorialKey = stage.tutorialId ? `cf_tut_${stage.tutorialId}` : null;
  const [showTutorial, setShowTutorial] = useState(() => {
    if (!stage.tutorial || !tutorialKey) return false;
    try { return !localStorage.getItem(tutorialKey); } catch { return true; }
  });
  const [tutStep, setTutStep] = useState(0);
  const dismissTutorial = () => {
    if (tutorialKey) { try { localStorage.setItem(tutorialKey, '1'); } catch {} }
    setShowTutorial(false);
    setTutStep(0);
  };
  const advanceTutorial = () => {
    const steps = stage.tutorial?.steps;
    if (steps && tutStep < steps.length - 1) {
      setTutStep(t => t + 1);
    } else {
      dismissTutorial();
    }
  };

  const { powered, byColor, gateOpen, levels, depths } = computePowered(grid);
  const [flowing, setFlowing] = useState(false);
  const showLevels = React.useMemo(() => {
    for (const row of grid) for (const c of row) {
      if (c.type === 'resistor' || c.type === 'amp' || c.type === 'resistorL' || c.type === 'ampL') return true;
    }
    return false;
  }, [grid]);
  const solved = isSolved(grid, byColor);

  useEffect(() => {
    if (solved && !cleared && !flowing) {
      setFlowing(true);
      const finalElapsed = taActive && startTime != null ? Date.now() - startTime : 0;
      if (taActive && finalElapsed > 0) setFinalMs(finalElapsed);
      const maxDepth = depths.flat().reduce((a, b) => Math.max(a, b), 0);
      const animMs = Math.max(450, maxDepth * 90 + 350);
      if (challengeMode) {
        const isPerfect = moves <= stage.minMoves;
        const t = setTimeout(() => {
          playClear();
          if (onChallengeClear) onChallengeClear({ moves, minMoves: stage.minMoves, isPerfect });
        }, Math.min(animMs, 600));
        return () => clearTimeout(t);
      }
      const t = setTimeout(() => {
        playClear();
        const s = calcStars(moves, stage.minMoves, hintUsed);
        setStars(s);
        setCleared(true);
        if (saveKey) {
          if (!bestStars[saveKey] || bestStars[saveKey] < s) {
            setBestStars(prev => ({ ...prev, [saveKey]: s }));
          }
          if (bestMoves[saveKey] == null || moves < bestMoves[saveKey]) {
            setBestMoves(prev => ({ ...prev, [saveKey]: moves }));
            setIsNewBest(true);
          }
          if (taActive && finalElapsed > 0 && !hintUsed && setBestTimes) {
            const prev = bestTimes?.[saveKey];
            if (prev == null || finalElapsed < prev) {
              setBestTimes(p => ({ ...(p || {}), [saveKey]: finalElapsed }));
              setIsNewBestTime(true);
            }
          }
        }
        setFlowing(false);
      }, animMs);
      return () => clearTimeout(t);
    }
  }, [solved]);

  const prevLitCount = useRef(0);
  useEffect(() => {
    if (cleared) { prevLitCount.current = 0; return; }
    let count = 0;
    grid.forEach((row, r) => row.forEach((cell, c) => {
      if (cell.type === 'bulb' && byColor[cell.color || 'cyan']?.[r]?.[c]) count++;
    }));
    if (count > prevLitCount.current && !solved) playBulbLit();
    prevLitCount.current = count;
  }, [grid]);

  const rotate = useCallback((r, c, cw) => {
    if (cleared || flowing) return;
    const cell = grid[r][c];
    if (cell.type === 'empty' || cell.type === 'bridge' || cell.type === 'switch' || cell.locked) return;

    if (taActive && startTime == null) setStartTime(Date.now());

    // router: toggle active arm (state 0↔1), no rotation
    if (cell.type === 'router') {
      playRotate();
      setHistory(h => [...h, { grid: grid.map(row => row.map(c => ({ ...c }))), moves }]);
      setGrid(prev => {
        const next = prev.map(row => row.map(c => ({ ...c })));
        next[r][c].state = ((next[r][c].state || 0) + 1) % 2;
        return next;
      });
      setMoves(m => m + 1);
      return;
    }

    playRotate();
    setHistory(h => [...h, { grid: grid.map(row => row.map(c => ({ ...c }))), moves }]);

    // Build set of (r,c) -> cw that will rotate. For gears, chain through adjacent gears with alternating direction.
    const chain = new Map();
    chain.set(`${r}-${c}`, cw);
    if (cell.type === 'gear') {
      const queue = [[r, c, cw]];
      while (queue.length) {
        const [cr, cc, ccw] = queue.shift();
        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nr = cr + dr, nc = cc + dc;
          if (nr < 0 || nr >= grid.length || nc < 0 || nc >= grid[0].length) continue;
          if (grid[nr][nc].type !== 'gear') continue;
          if (grid[nr][nc].locked) continue;
          const key = `${nr}-${nc}`;
          if (chain.has(key)) continue;
          chain.set(key, !ccw);
          queue.push([nr, nc, !ccw]);
        }
      }
    }

    setRotatingCells(chain);
    setTimeout(() => setRotatingCells(new Map()), 130);

    setGrid(prev => {
      const next = prev.map(row => row.map(cell => ({ ...cell })));
      for (const [key, dir] of chain) {
        const [rr, cc] = key.split('-').map(Number);
        next[rr][cc].rotation = ((next[rr][cc].rotation + (dir ? 1 : -1)) % 4 + 4) % 4;
      }
      return next;
    });
    setMoves(m => m + 1);
  }, [grid, moves, cleared, flowing, taActive, startTime]);

  // Parts-bin: place the selected piece into an empty slot (counts as a move)
  const placePiece = useCallback((r, c, type) => {
    if (cleared || flowing) return;
    if ((bin[type] || 0) <= 0) return;
    if (taActive && startTime == null) setStartTime(Date.now());
    playRotate();
    setHistory(h => [...h, { grid: grid.map(row => row.map(cl => ({ ...cl }))), moves, bin: { ...bin } }]);
    setGrid(prev => {
      const next = prev.map(row => row.map(cl => ({ ...cl })));
      next[r][c] = { type, rotation: 0, locked: false, placed: true };
      return next;
    });
    const remaining = (bin[type] || 0) - 1;
    setBin(b => ({ ...b, [type]: (b[type] || 0) - 1 }));
    if (remaining <= 0) setSelectedPiece(null);
    setMoves(m => m + 1);
  }, [grid, moves, bin, cleared, flowing, taActive, startTime]);

  // Parts-bin: pick a placed piece back up, returning it to the bin (does not cost a move)
  const removePiece = useCallback((r, c) => {
    if (cleared || flowing) return;
    const t = grid[r][c].type;
    playRotate();
    setHistory(h => [...h, { grid: grid.map(row => row.map(cl => ({ ...cl }))), moves, bin: { ...bin } }]);
    setGrid(prev => {
      const next = prev.map(row => row.map(cl => ({ ...cl })));
      next[r][c] = { type: 'empty', rotation: 0, locked: false };
      return next;
    });
    setBin(b => ({ ...b, [t]: (b[t] || 0) + 1 }));
  }, [grid, moves, bin, cleared, flowing]);

  // Rotation direction toggle (mobile-friendly: no right-click needed)
  const [rotateDir, setRotateDir] = useState(() => {
    try { return localStorage.getItem('cf_rotate_dir') !== '0'; } catch { return true; }
  });
  useEffect(() => { try { localStorage.setItem('cf_rotate_dir', rotateDir ? '1' : '0'); } catch {} }, [rotateDir]);

  // Long-press detection (mobile): press > 350ms → rotate opposite direction
  const pressRef = useRef({ t: 0, r: -1, c: -1, longFired: false });
  const handlePointerDown = useCallback((r, c, e) => {
    if (e.button === 2) return; // right-click handled by onContextMenu
    pressRef.current = { t: Date.now(), r, c, longFired: false };
  }, []);
  const handlePointerUp = useCallback((r, c, e) => {
    if (e.button === 2) return;
    const p = pressRef.current;
    if (p.longFired || p.r !== r || p.c !== c) return;
    const dur = Date.now() - p.t;
    if (dur >= 350) {
      pressRef.current = { ...p, longFired: true };
      if (stage.partsBin && grid[r][c].placed) removePiece(r, c); // hold to pick up a placed piece
      else rotate(r, c, !rotateDir);
    }
  }, [rotate, rotateDir, stage.partsBin, grid, removePiece]);
  const handleCellClick = useCallback((r, c) => {
    if (pressRef.current.longFired) {
      pressRef.current = { ...pressRef.current, longFired: false };
      return; // long press already handled
    }
    if (stage.partsBin) {
      const cell = grid[r][c];
      if (slotMask && slotMask[r][c] && cell.type === 'empty') {
        if (selectedPiece) placePiece(r, c, selectedPiece); // drop selected piece into the slot
        return;
      }
      rotate(r, c, rotateDir); // placed/fixed piece → rotate (rotate() guards empties & locks)
      return;
    }
    rotate(r, c, rotateDir);
  }, [rotate, rotateDir, stage.partsBin, grid, slotMask, selectedPiece, placePiece]);
  const handleCellRightClick = useCallback((r, c, e) => {
    e.preventDefault();
    rotate(r, c, !rotateDir);
  }, [rotate, rotateDir]);

  const handleHintFull = useCallback(() => {
    if (hintUsed || cleared || !stage.solution) return;
    if ((availableStars || 0) < HINT_FULL_COST) return;
    if (onSpendStars) onSpendStars(HINT_FULL_COST);
    setHintUsed(true);
    setGrid(stage.grid.map((row, ri) =>
      row.map((cell, ci) => {
        if (cell.type === 'router') return { ...cell, state: stage.solution[ri][ci] };
        return { ...cell, rotation: stage.solution[ri][ci] };
      })
    ));
  }, [hintUsed, cleared, stage, availableStars, onSpendStars]);

  const handleHintLight = useCallback(() => {
    if (cleared || !stage.solution) return;
    if ((availableStars || 0) < HINT_LIGHT_COST) return;
    // Collect cells whose current rotation/state differs from the solution and are interactable
    const wrongCells = [];
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        const cell = grid[r][c];
        if (cell.type === 'empty' || cell.type === 'bridge' || cell.type === 'switch' || cell.locked) continue;
        const sol = stage.solution[r][c];
        const cur = cell.type === 'router' ? (cell.state || 0) : cell.rotation;
        if (cur !== sol) wrongCells.push({ r, c });
      }
    }
    if (wrongCells.length === 0) return;
    const pick = wrongCells[Math.floor(Math.random() * wrongCells.length)];
    if (onSpendStars) onSpendStars(HINT_LIGHT_COST);
    setHistory(h => [...h, { grid: grid.map(row => row.map(c => ({ ...c }))), moves }]);
    setGrid(prev => {
      const next = prev.map(row => row.map(c => ({ ...c })));
      const cell = next[pick.r][pick.c];
      const sol = stage.solution[pick.r][pick.c];
      if (cell.type === 'router') cell.state = sol;
      else cell.rotation = sol;
      return next;
    });
  }, [grid, moves, cleared, stage, availableStars, onSpendStars]);

  const handleUndo = useCallback(() => {
    if (history.length === 0 || cleared) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setGrid(prev.grid);
    setMoves(prev.moves);
    if (prev.bin) setBin(prev.bin); // restore parts-bin counts (snapshots from place/remove carry it)
  }, [history, cleared]);

  const handleRestart = () => {
    setGrid(stage.grid.map(row => row.map(cell => ({ ...cell }))));
    setMoves(0);
    setHintUsed(false);
    setCleared(false);
    setStars(0);
    setHistory([]);
    setStartTime(null);
    setElapsedMs(0);
    setFinalMs(0);
    setIsNewBestTime(false);
    setBin(stage.inventory ? { ...stage.inventory } : {});
    setSelectedPiece(null);
  };

  const vw = useViewportWidth();
  const idealCell = grid[0].length <= 3 ? 80 : grid[0].length === 4 ? 68 : 58;
  const cellSize = fitCellSize(vw, grid[0].length, idealCell);

  return (
    <div className="screen">
      {!challengeMode && (
        <div className="header">
          <div>
            <div className="stage-label">
              {stage.name && stageIdx != null ? `STAGE ${stageIdx + 1}` : 'CIRCUIT FLOW'}
              {taActive && <span className="ta-badge">TIME ATTACK</span>}
            </div>
            <div className="stage-title">{stage.name}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div className="moves-label">MOVES</div>
            <div className="moves-val">{moves}</div>
            {taActive && (
              <div className="ta-time">{fmtMs(finalMs > 0 ? finalMs : elapsedMs)}</div>
            )}
            {(() => {
              const mm = stage.minMoves;
              if (!mm) return null;
              const star2Limit = Math.floor(mm * 1.5);
              if (moves <= mm) {
                const r = mm - moves;
                return <div className="prox prox-3">★3 まで <b>{r === 0 ? '!' : r + '手'}</b></div>;
              }
              if (moves <= star2Limit) {
                const r = star2Limit - moves;
                return <div className="prox prox-2">★2 まで <b>{r === 0 ? '!' : r + '手'}</b></div>;
              }

// ─── Stage Thumbnail ──────────────────────────────────────────────────────────
function StageThumbnail({ grid, size = 72 }) {
  if (!grid || !grid.length) return null;
  const rows = grid.length;
  const cols = grid[0].length;
  const cs   = Math.floor(size / Math.max(rows, cols)); // cell size
  const gap  = Math.max(1, Math.floor(cs / 10));
  const W    = cs * cols;
  const H    = cs * rows;
  const { powered, byColor } = computePowered(grid);
  const COLOR = { cyan: '#00ffcc', red: '#ff4455', blue: '#4488ff', yellow: '#ffcc00', green: '#44ff88' };
  const dirs  = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // N E S W

  return (
    <svg width={W} height={H} style={{ display: 'block', borderRadius: 5, flexShrink: 0 }}>
      <rect width={W} height={H} fill="#0d1225" rx={4} />
      {grid.map((row, r) => row.map((cell, c) => {
        const pw  = powered[r][c];
        const x   = c * cs; const y = r * cs;
        const cx2 = x + cs / 2; const cy2 = y + cs / 2;
        const bg  = pw ? '#0a1a2a' : '#111827';
        const wc  = pw ? (COLOR[pw] || COLOR.cyan) : '#223344';
        const sw  = Math.max(1.5, cs / 6);
        if (cell.type === 'empty') return (
          <rect key={`${r}-${c}`} x={x + gap} y={y + gap} width={cs - gap * 2} height={cs - gap * 2} fill="#0d1120" rx={1} />
        );
        const conns = getConnections(cell.type, cell.rotation);
        return (
          <g key={`${r}-${c}`}>
            <rect x={x + gap} y={y + gap} width={cs - gap * 2} height={cs - gap * 2} fill={bg} rx={1} />
            {[...conns].map(d => (
              <line key={d}
                x1={cx2} y1={cy2}
                x2={cx2 + dirs[d][0] * cs / 2} y2={cy2 + dirs[d][1] * cs / 2}
                stroke={wc} strokeWidth={sw} strokeLinecap="round" />
            ))}
            {cell.type === 'source' && (
              <circle cx={cx2} cy={cy2} r={cs / 4} fill={pw ? (COLOR[pw] || COLOR.cyan) : '#1a4a3a'} />
            )}
            {cell.type === 'bulb' && (
              <circle cx={cx2} cy={cy2} r={cs / 3.2}
                fill={byColor[cell.color || 'cyan']?.[r]?.[c] ? '#ffee44' : '#1a1a0a'} />
            )}
          </g>
        );
      }))}
    </svg>
  );
}

let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function soundEnabled() {
  try { return JSON.parse(localStorage.getItem('cf_settings') || '{}').sound !== false; } catch { return true; }
}
function hapticEnabled() {
  try { return JSON.parse(localStorage.getItem('cf_settings') || '{}').haptic !== false; } catch { return true; }
}
function buzz(ms = 8) {
  if (hapticEnabled() && navigator.vibrate) try { navigator.vibrate(ms); } catch {}
}
function activeSoundPack() {
  try { return localStorage.getItem('cf_sound_active') || 'default'; } catch { return 'default'; }
}
function playRotate() {
  if (!soundEnabled()) return;
  buzz(6);
  try {
    const ctx = getAudioCtx(), t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const pack = activeSoundPack();
    if (pack === 'retro') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.linearRampToValueAtTime(440, t + 0.05);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.start(t); osc.stop(t + 0.07);
    } else if (pack === 'future') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1100, t);
      osc.frequency.exponentialRampToValueAtTime(220, t + 0.08);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      osc.start(t); osc.stop(t + 0.1);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(700, t);
      osc.frequency.exponentialRampToValueAtTime(320, t + 0.055);
      gain.gain.setValueAtTime(0.13, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
      osc.start(t); osc.stop(t + 0.07);
    }
  } catch {}
}
function playBulbLit() {
  if (!soundEnabled()) return;
  buzz(10);
  try {
    const ctx = getAudioCtx(), t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const pack = activeSoundPack();
    if (pack === 'retro') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(523, t);
      osc.frequency.setValueAtTime(784, t + 0.04);
      osc.frequency.setValueAtTime(1047, t + 0.08);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t); osc.stop(t + 0.22);
    } else if (pack === 'future') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.exponentialRampToValueAtTime(2200, t + 0.15);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t); osc.stop(t + 0.42);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, t);
      osc.frequency.exponentialRampToValueAtTime(990, t + 0.09);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.32);
    }
  } catch {}
}
function playClear() {
  if (!soundEnabled()) return;
  buzz(30);
  try {
    const ctx = getAudioCtx();
    const pack = activeSoundPack();
    let notes, oscType;
    if (pack === 'retro') {
      notes = [523, 659, 784, 1047, 1319]; oscType = 'square';
    } else if (pack === 'future') {
      notes = [330, 494, 740, 988, 1480]; oscType = 'sawtooth';
    } else {
      notes = [523, 659, 784, 1047]; oscType = 'sine';
    }
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = oscType;
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * (pack === 'retro' ? 0.08 : 0.11);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(pack === 'retro' ? 0.14 : 0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      osc.start(t); osc.stop(t + 0.6);
    });
  } catch {}
}

function StageEditor({ initialStage, onBack, onTestPlay, onSave }) {
  const [name, setName]           = useState(initialStage?.name || '無題のステージ');
  const [rows, setRows]           = useState(initialStage?.grid.length || 4);
  const [cols, setCols]           = useState(initialStage?.grid[0]?.length || 4);
  const [grid, setGrid]           = useState(() =>
    initialStage ? initialStage.grid.map(r => r.map(c => ({ ...c }))) : makeEmptyGrid(4, 4)
  );
  const [minMoves, setMinMoves]   = useState(initialStage?.minMoves || 5);
  const [selType, setSelType]     = useState('straight');
  const [selRotation, setSelRot]  = useState(0);
  const [selColor, setSelColor]   = useState('cyan');
  const [selLinkId, setSelLink]   = useState('A');
  const [selLinkId2, setSelLink2] = useState('B');
  const [selLimit, setSelLimit]   = useState(2);
  const [selPower, setSelPower]   = useState(9);
  const [selLocked, setSelLocked] = useState(false);
  const [errors, setErrors]       = useState([]);
  const [copied, setCopied]       = useState(false);
  const [showPublish, setShowPublish] = useState(false);
  const [pubAuthor, setPubAuthor]     = useState('');
  const [pubState, setPubState]       = useState('idle'); // idle|loading|done|error

  const { powered, byColor, gateOpen, levels } = computePowered(grid);
  const previewSolved = isSolved(grid, byColor);
  const editorShowLevels = grid.some(row => row.some(c =>
    c.type === 'resistor' || c.type === 'amp' || c.type === 'resistorL' || c.type === 'ampL' || c.type === 'fuse'));

  // Undo/Redo history
  const [history, setHistory] = useState([]);
  const [future, setFuture] = useState([]);
  const gestureChangedRef = useRef(false);
  const pushHistoryIfNeeded = useCallback((currentGrid) => {
    if (gestureChangedRef.current) return;
    gestureChangedRef.current = true;
    setHistory(h => [...h.slice(-49), currentGrid.map(row => row.map(c => ({ ...c })))]);
    setFuture([]);
  }, []);
  const undo = useCallback(() => {
    setHistory(h => {
      if (h.length === 0) return h;
      const prev = h[h.length - 1];
      setFuture(f => [...f, grid.map(row => row.map(c => ({ ...c })))]);
      setGrid(prev);
      return h.slice(0, -1);
    });
  }, [grid]);
  const redo = useCallback(() => {
    setFuture(f => {
      if (f.length === 0) return f;
      const next = f[f.length - 1];
      setHistory(h => [...h, grid.map(row => row.map(c => ({ ...c })))]);
      setGrid(next);
      return f.slice(0, -1);
    });
  }, [grid]);

  // Build the cell config from current selection
  const buildSelectedCell = () => {
    if (selType === 'empty') return E();
    const opts = {};
    if (['source', 'bulb'].includes(selType) && selColor !== 'cyan') opts.color = selColor;
    if (['switch', 'gate', 'igate', 'portal', 'andgate'].includes(selType)) opts.linkId = selLinkId;
    if (selType === 'andgate') opts.linkId2 = selLinkId2;
    if (selType === 'fuse') opts.limit = selLimit;
    if (selType === 'source' && selPower !== 9) opts.initialPower = selPower;
    return makeCell(selType, selRotation, selLocked, opts);
  };

  // B: tap behavior — same type → rotate; different type → replace
  const placeCellTap = (r, c) => {
    setGrid(prev => {
      pushHistoryIfNeeded(prev);
      const next = prev.map(row => row.map(cell => ({ ...cell })));
      const cur = next[r][c];
      if (selType === 'empty') {
        next[r][c] = E();
      } else if (cur.type === selType) {
        // Same type → rotate
        next[r][c] = { ...cur, rotation: (cur.rotation + 1) % 4 };
      } else {
        next[r][c] = buildSelectedCell();
      }
      return next;
    });
  };

  // D: paint mode (drag) — always place fresh (no rotation)
  const paintCellDrag = (r, c) => {
    setGrid(prev => {
      pushHistoryIfNeeded(prev);
      const next = prev.map(row => row.map(cell => ({ ...cell })));
      next[r][c] = selType === 'empty' ? E() : buildSelectedCell();
      return next;
    });
  };

  // C: long-press → delete
  const eraseCell = (r, c) => {
    setGrid(prev => {
      pushHistoryIfNeeded(prev);
      const next = prev.map(row => row.map(cell => ({ ...cell })));
      next[r][c] = E();
      return next;
    });
  };

  // Desktop right-click → rotate placed cell
  const rotateCell = (r, c, e) => {
    e.preventDefault();
    setGrid(prev => {
      pushHistoryIfNeeded(prev);
      const next = prev.map(row => row.map(cell => ({ ...cell })));
      if (next[r][c].type !== 'empty') {
        next[r][c] = { ...next[r][c], rotation: (next[r][c].rotation + 1) % 4 };
      }
      return next;
    });
  };

  // Unified pointer handler on the grid (handles tap, long-press, drag)
  const dragRef = useRef({ active: false, startR: -1, startC: -1, painted: new Set(), longTimer: null, longFired: false });
  const cellFromEvent = (clientX, clientY) => {
    const el = document.elementFromPoint(clientX, clientY);
    if (!el) return null;
    const cell = el.closest && el.closest('[data-er]');
    if (!cell) return null;
    return { r: +cell.dataset.er, c: +cell.dataset.ec };
  };
  const onGridPointerDown = (e) => {
    if (e.button === 2) return; // right-click handled by onContextMenu
    const cell = cellFromEvent(e.clientX, e.clientY);
    if (!cell) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    gestureChangedRef.current = false;
    dragRef.current = { active: true, startR: cell.r, startC: cell.c, painted: new Set(), longFired: false, longTimer: null };
    // Long-press timer for erase
    const r = cell.r, c = cell.c;
    dragRef.current.longTimer = setTimeout(() => {
      if (!dragRef.current.active) return;
      if (dragRef.current.painted.size > 0) return; // already painting
      dragRef.current.longFired = true;
      eraseCell(r, c);
    }, 500);
  };
  const onGridPointerMove = (e) => {
    if (!dragRef.current.active) return;
    const cell = cellFromEvent(e.clientX, e.clientY);
    if (!cell) return;
    const { r, c } = cell;
    // Detect entering a new cell → switch to paint mode
    const movedOff = (r !== dragRef.current.startR || c !== dragRef.current.startC);
    if (movedOff || dragRef.current.painted.size > 0) {
      if (dragRef.current.longTimer) { clearTimeout(dragRef.current.longTimer); dragRef.current.longTimer = null; }
      if (dragRef.current.longFired) return;
      const startKey = `${dragRef.current.startR}-${dragRef.current.startC}`;
      if (!dragRef.current.painted.has(startKey)) {
        dragRef.current.painted.add(startKey);
        paintCellDrag(dragRef.current.startR, dragRef.current.startC);
      }
      const key = `${r}-${c}`;
      if (!dragRef.current.painted.has(key)) {
        dragRef.current.painted.add(key);
        paintCellDrag(r, c);
      }
    }
  };
  const onGridPointerUp = (e) => {
    if (!dragRef.current.active) return;
    if (dragRef.current.longTimer) { clearTimeout(dragRef.current.longTimer); dragRef.current.longTimer = null; }
    const justTapped = !dragRef.current.longFired && dragRef.current.painted.size === 0;
    if (justTapped) {
      placeCellTap(dragRef.current.startR, dragRef.current.startC);
    }
    dragRef.current.active = false;
  };

  const resizeGrid = (dr, dc) => {
    const nr = Math.max(2, Math.min(7, rows + dr));
    const nc = Math.max(2, Math.min(7, cols + dc));
    if (nr === rows && nc === cols) return;
    setRows(nr); setCols(nc);
    setGrid(prev => {
      setHistory(h => [...h.slice(-49), prev.map(row => row.map(c => ({ ...c })))]);
      setFuture([]);
      return Array.from({ length: nr }, (_, r) =>
        Array.from({ length: nc }, (_, c) => prev[r]?.[c] ? { ...prev[r][c] } : E())
      );
    });
  };

  const validate = () => {
    const errs = [];
    let src = 0, bulb = 0;
    for (const row of grid) for (const cell of row) {
      if (cell.type === 'source') src++;
      if (cell.type === 'bulb')   bulb++;
    }
    if (src  === 0) errs.push('電源（⚡）を1つ以上置いてください');
    if (bulb === 0) errs.push('電球（💡）を1つ以上置いてください');
    if (previewSolved) errs.push('初期状態でクリアされています。ピースを回転させてください');
    return errs;
  };

  const handleSave = () => {
    const errs = validate();
    if (errs.length) { setErrors(errs); return; }
    setErrors([]);
    onSave({ name, grid, minMoves: Math.max(1, Number(minMoves)) });
  };

  const handleTest = () => {
    const errs = validate();
    if (errs.length) { setErrors(errs); return; }
    setErrors([]);
    onTestPlay({ name, grid, minMoves: Math.max(1, Number(minMoves)) });
  };

  const handlePublish = async () => {
    const errs = validate();
    if (errs.length) { setErrors(errs); return; }
    setErrors([]);
    setPubState('loading');
    try {
      await publishStageToCloud({ name, grid, minMoves: Math.max(1, Number(minMoves)) }, pubAuthor);
      setPubState('done');
      setTimeout(() => { setPubState('idle'); setShowPublish(false); }, 2200);
    } catch {
      setPubState('error');
      setTimeout(() => setPubState('idle'), 3000);
    }
  };

  const handleCopyUrl = () => {
    const errs = validate();
    if (errs.length) { setErrors(errs); return; }
    setErrors([]);
    const stage = { name, grid, minMoves: Math.max(1, Number(minMoves)) };
    window.location.hash = encodeStageToHash(stage);
    const url = window.location.href;
    navigator.clipboard.writeText(url)
      .then(() => { setCopied(true); setTimeout(() => setCopied(false), 2500); })
      .catch(() => { prompt('このURLをコピーしてシェアしてください:', url); });
  };

  const vw = useViewportWidth();
  const idealEditorCell = cols <= 3 ? 80 : cols <= 4 ? 70 : cols <= 5 ? 60 : cols <= 6 ? 52 : 45;
  const editorCellSize = fitCellSize(vw, cols, idealEditorCell, 32);
  const selPiece = PIECE_PALETTE.find(p => p.type === selType);

  return (
    <div className="screen">
      <div className="header">
        <div>
          <div className="stage-label">ステージエディタ</div>
          <input
            className="editor-name-input"
            value={name}
            onChange={e => setName(e.target.value)}
            placeholder="ステージ名"
          />
        </div>
        <button className="btn" onClick={onBack}
          style={{ width: 'auto', padding: '8px 14px', marginBottom: 0 }}>← 戻る</button>
      </div>

      {/* Piece palette */}
      <div className="palette">
        {PIECE_PALETTE.map(p => (
          <div
            key={p.type}
            className={`palette-item ${selType === p.type ? 'selected' : ''}`}
            onClick={() => setSelType(p.type)}
          >
            {p.type === 'empty'
              ? <span style={{ fontSize: 18, lineHeight: 1 }}>🗑</span>
              : <PieceSVG
                  type={p.type} rotation={selType === p.type ? selRotation : 0}
                  isPowered={false} isBulbLit={false} isLocked={false} size={34}
                  powerColor="cyan"
                  cellColor={selType === p.type && p.hasColor ? selColor : 'cyan'}
                  isOpen={p.type !== 'igate'}
                  linkLabel={p.hasLimit ? (selType === p.type ? selLimit : 2)
                           : (p.hasLink ? (selType === p.type ? selLinkId : 'A') : undefined)}
                />
            }
            <span style={{ fontSize: 8, marginTop: 2, lineHeight: 1, color: selType === p.type ? '#7df' : '#556' }}>
              {p.label}
            </span>
          </div>
        ))}
      </div>

      {/* Sub-controls: rotation, color, linkId, locked */}
      <div className="sub-palette">
        {selType !== 'empty' && (
          <>
            <button className="rot-btn" onClick={() => setSelRot(r => (r + 3) % 4)}>↺</button>
            <span style={{ fontSize: 12, color: '#778', minWidth: 36, textAlign: 'center' }}>
              {['↑N', '→E', '↓S', '←W'][selRotation]}
            </span>
            <button className="rot-btn" onClick={() => setSelRot(r => (r + 1) % 4)}>↻</button>
          </>
        )}
        {selPiece?.hasColor && (
          <>
            <span style={{ fontSize: 11, color: '#556', marginLeft: 4 }}>色:</span>
            {Object.entries(COLOR_HEX).filter(([k]) => k !== 'mixed').map(([key, hex]) => (
              <div key={key} className={`color-dot ${selColor === key ? 'selected' : ''}`}
                style={{ background: hex }} onClick={() => setSelColor(key)} />
            ))}
          </>
        )}
        {selPiece?.hasLink && (
          <>
            <span style={{ fontSize: 11, color: '#556', marginLeft: 4 }}>{selPiece?.hasLink2 ? 'リンク1:' : 'リンク:'}</span>
            {LINK_IDS.map(id => (
              <button key={id} className="rot-btn"
                style={{ padding: '3px 8px', fontSize: 13, background: selLinkId === id ? '#2a5aaa' : '#1a2535' }}
                onClick={() => setSelLink(id)}>{id}</button>
            ))}
          </>
        )}
        {selPiece?.hasLink2 && (
          <>
            <span style={{ fontSize: 11, color: '#556', marginLeft: 4 }}>リンク2:</span>
            {LINK_IDS.map(id => (
              <button key={id} className="rot-btn"
                style={{ padding: '3px 8px', fontSize: 13, background: selLinkId2 === id ? '#aa5a2a' : '#1a2535' }}
                onClick={() => setSelLink2(id)}>{id}</button>
            ))}
          </>
        )}
        {selPiece?.hasLimit && (
          <>
            <span style={{ fontSize: 11, color: '#556', marginLeft: 4 }}>上限:</span>
            {[1, 2, 3, 4].map(n => (
              <button key={n} className="rot-btn"
                style={{ padding: '3px 8px', fontSize: 13, background: selLimit === n ? '#2a5aaa' : '#1a2535' }}
                onClick={() => setSelLimit(n)}>≤{n}</button>
            ))}
          </>
        )}
        {selPiece?.hasPower && (
          <>
            <span style={{ fontSize: 11, color: '#556', marginLeft: 4 }}>電力:</span>
            {[1, 2, 3, 5, 9].map(n => (
              <button key={n} className="rot-btn"
                style={{ padding: '3px 8px', fontSize: 13, background: selPower === n ? '#2a5aaa' : '#1a2535' }}
                onClick={() => setSelPower(n)}>{n}</button>
            ))}
          </>
        )}
        {selType !== 'empty' && (
          <label style={{ fontSize: 11, color: selLocked ? '#7df' : '#556', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, marginLeft: 4 }}>
            <input type="checkbox" checked={selLocked} onChange={e => setSelLocked(e.target.checked)} style={{ margin: 0 }}/>
            固定
          </label>
        )}
      </div>

      {/* Live circuit preview status */}
      {previewSolved && (
        <div style={{ fontSize: 12, color: '#ffee44', marginBottom: 6, textAlign: 'center' }}>
          ⚡ 回路が繋がっています（保存前にピースを回転させてください）
        </div>
      )}

      {/* Editor grid */}
      <div className="grid-wrapper editor-grid-wrapper"
        onPointerDown={onGridPointerDown}
        onPointerMove={onGridPointerMove}
        onPointerUp={onGridPointerUp}
        onPointerCancel={onGridPointerUp}
      >
        <div className="grid" style={{ gridTemplateColumns: `repeat(${cols}, ${editorCellSize}px)`, gap: 4 }}>
          {grid.map((row, r) => row.map((cell, c) => {
            const pw = powered[r][c];
            const isLit = previewSolved && cell.type === 'bulb' && !!byColor[cell.color || 'cyan']?.[r][c];
            return (
              <div key={`${r}-${c}`}
                data-er={r}
                data-ec={c}
                className={`cell ${pw ? 'powered' : ''} ${cell.locked ? 'locked' : ''}`}
                style={{ width: editorCellSize, height: editorCellSize }}
                onContextMenu={(e) => rotateCell(r, c, e)}
              >
                <PieceSVG
                  type={cell.type} rotation={cell.rotation}
                  isPowered={!!pw} isBulbLit={isLit} isLocked={cell.locked}
                  size={editorCellSize} powerColor={pw} cellColor={cell.color}
                  isOpen={cell.type === 'gate' ? !!gateOpen[cell.linkId]
                        : cell.type === 'igate' ? !gateOpen[cell.linkId]
                        : cell.type === 'andgate' ? ([cell.linkId, cell.linkId2].filter(Boolean).every(id => gateOpen[id]))
                        : false}
                  linkLabel={cell.type === 'fuse' ? (cell.limit ?? 2)
                           : cell.type === 'andgate' ? `${cell.linkId || ''}&${cell.linkId2 || ''}`
                           : cell.linkId}
                  level={editorShowLevels ? levels[r][c] : 0}
                  state={cell.state || 0}
                />
              </div>
            );
          }))}
        </div>
      </div>

      {/* Undo/Redo */}
      <div className="size-control">
        <span style={{ fontSize: 11, color: '#556' }}>編集:</span>
        <button className="size-btn" onClick={undo} disabled={history.length === 0}
          style={{ opacity: history.length === 0 ? 0.4 : 1 }}>↩ 元に戻す</button>
        <button className="size-btn" onClick={redo} disabled={future.length === 0}
          style={{ opacity: future.length === 0 ? 0.4 : 1 }}>↪ やり直し</button>
        <span style={{ fontSize: 10, color: '#445', marginLeft: 'auto' }}>
          {history.length}/{history.length + future.length} 履歴
        </span>
      </div>

      {/* Grid size controls */}
      <div className="size-control">
        <span style={{ fontSize: 11, color: '#556' }}>グリッド:</span>
        <button className="size-btn" onClick={() => resizeGrid(-1, 0)}>行−</button>
        <span style={{ fontSize: 13, color: '#adf', minWidth: 48, textAlign: 'center' }}>{rows}×{cols}</span>
        <button className="size-btn" onClick={() => resizeGrid(1, 0)}>行＋</button>
        <button className="size-btn" onClick={() => resizeGrid(0, -1)}>列−</button>
        <button className="size-btn" onClick={() => resizeGrid(0, 1)}>列＋</button>
      </div>

      {/* minMoves setting */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
        <span style={{ fontSize: 12, color: '#556' }}>★★★ の基準:</span>
        <input type="number" min={1} max={99} value={minMoves}
          onChange={e => setMinMoves(e.target.value)}
          style={{ width: 52, background: '#111827', border: '1px solid #2a3545', color: '#adf', borderRadius: 6, padding: '4px 8px', fontSize: 14, textAlign: 'center' }}
        />
        <span style={{ fontSize: 11, color: '#445' }}>手以内</span>
      </div>

      {/* Validation errors */}
      {errors.map((err, i) => <div key={i} className="editor-error">⚠ {err}</div>)}

      {/* Action buttons */}
      <div style={{ display: 'flex', gap: 8, width: '100%' }}>
        <button className="btn" onClick={handleTest} style={{ flex: 1 }}>▶ テスト</button>
        <button className="btn primary" onClick={handleSave} style={{ flex: 1 }}>💾 保存</button>
        <button className="btn" onClick={handleCopyUrl}
          style={{ flex: 1, background: copied ? '#0a2a1a' : undefined, borderColor: copied ? '#2aaa66' : undefined, color: copied ? '#4dffaa' : undefined }}>
          {copied ? '✓ コピー済' : '🔗 シェア'}
        </button>
      </div>
      {/* Publish to cloud */}
      {!showPublish ? (
        <button className="btn" onClick={() => setShowPublish(true)}
          style={{ width: '100%', marginTop: 4, borderColor: '#1a3a1a', color: '#4a9a6a' }}>
          🌐 みんなに公開する
        </button>
      ) : (
        <div className="publish-panel">
          <div style={{ fontSize: 12, color: '#4a8a5a', marginBottom: 6 }}>作者名（省略で匿名）</div>
          <input
            className="editor-name-input"
            value={pubAuthor}
            onChange={e => setPubAuthor(e.target.value)}
            placeholder="匿名"
            style={{ width: '100%', marginBottom: 10 }}
          />
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn" onClick={() => { setShowPublish(false); setPubState('idle'); }} style={{ flex: 1 }}>
              キャンセル
            </button>
            <button className="btn primary" onClick={handlePublish} disabled={pubState === 'loading'}
              style={{ flex: 2, background: pubState === 'done' ? '#0a2a1a' : pubState === 'error' ? '#2a0a0a' : undefined,
                       borderColor: pubState === 'done' ? '#2aaa66' : pubState === 'error' ? '#aa2222' : undefined }}>
              {pubState === 'loading' ? '公開中...' : pubState === 'done' ? '✓ 公開しました！' : pubState === 'error' ? '⚠ エラー（再試行）' : '🌐 公開する'}
            </button>
          </div>
        </div>
      )}
      <div style={{ fontSize: 10, color: '#445', marginTop: 8, textAlign: 'center', lineHeight: 1.7 }}>
        タップ: 配置（同じ種類なら回転）／ 長押し: 削除 ／ ドラッグ: 連続配置<br/>
        <span style={{ color: '#334' }}>PCの右クリック: 既存ピースを回転</span>
      </div>
    </div>
  );
}

const dateHash = (s) => {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
};

// Pool: easier stages (0..49) shuffled, reshuffled when exhausted.
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickItemByWeights(weightKey) {
  const pool = [
    ...THEMES.map(t => ({ ...t, kind: 'theme' })),
    ...WIRE_SKINS.map(w => ({ ...w, kind: 'wire' })),
    ...MIRROR_SHAPES.map(s => ({ ...s, kind: 'mirror' })),
    ...PORTAL_SHAPES.map(s => ({ ...s, kind: 'portal' })),
    ...ALL_SHAPE_TYPES.flatMap(g => g.list.map(s => ({ ...s, kind: g.kind }))),
  ];
  const total = pool.reduce((s, it) => s + RARITY_INFO[it.rarity][weightKey], 0);
  let n = Math.random() * total;
  for (const it of pool) {
    n -= RARITY_INFO[it.rarity][weightKey];
    if (n <= 0) return it;
  }
  return pool[0];
}

function GachaScreen({ themesOwned, setThemesOwned, activeTheme, setActiveTheme, wireSkinsOwned, setWireSkinsOwned, activeWireSkin, setActiveWireSkin, mirrorShapesOwned, setMirrorShapesOwned, activeMirrorShape, setActiveMirrorShape, portalShapesOwned, setPortalShapesOwned, activePortalShape, setActivePortalShape, skinPool, setSkinOwned, setSkinActive, availableStars, onSpendStars, lastDailyDraw, setLastDailyDraw, onBack }) {

  const [revealStep, setRevealStep] = useState(0);
  const [animating, setAnimating] = useState(false);

  const doPulls = (count, weightKey, costToSpend) => {
    if (animating) return;
    const ownedThemes = new Set(themesOwned);
    const ownedWires = new Set(wireSkinsOwned);
    const ownedMirrors = new Set(mirrorShapesOwned);
    const ownedPortals = new Set(portalShapesOwned);
    const ownedPool = {};
    for (const g of ALL_SHAPE_TYPES) {
      ownedPool[g.kind] = new Set(skinPool[g.kind]?.owned || ['default']);
    }
    const checkOwned = (kind, id) => {
      if (kind === 'theme') return ownedThemes.has(id);
      if (kind === 'wire')  return ownedWires.has(id);
      if (kind === 'mirror') return ownedMirrors.has(id);
      if (kind === 'portal') return ownedPortals.has(id);
      return ownedPool[kind]?.has(id);
    };
    const addOwned = (kind, id) => {
      if (kind === 'theme') ownedThemes.add(id);
      else if (kind === 'wire') ownedWires.add(id);
      else if (kind === 'mirror') ownedMirrors.add(id);
      else if (kind === 'portal') ownedPortals.add(id);
      else ownedPool[kind]?.add(id);
    };
    const results = [];
    let refundTotal = 0;
    for (let i = 0; i < count; i++) {
      const it = pickItemByWeights(weightKey);
      const isNew = !checkOwned(it.kind, it.id);
      if (isNew) addOwned(it.kind, it.id);
      else refundTotal += GACHA_DUPE_REFUND;
      results.push({ item: it, isNew, refunded: !isNew });
    }
    if (costToSpend > 0) onSpendStars(costToSpend);
    if (refundTotal > 0) onSpendStars(-refundTotal);
    setThemesOwned(Array.from(ownedThemes));
    setWireSkinsOwned(Array.from(ownedWires));
    setMirrorShapesOwned(Array.from(ownedMirrors));
    setPortalShapesOwned(Array.from(ownedPortals));
    for (const g of ALL_SHAPE_TYPES) {
      setSkinOwned(g.kind, Array.from(ownedPool[g.kind]));
    }
    setPulls(results);
    setRevealStep(0);
    setAnimating(true);
    let i = 0;
    const tick = () => {
      i++;
      setRevealStep(i);
      if (i < results.length) setTimeout(tick, 280);
      else setAnimating(false);
    };
    setTimeout(tick, 250);

    setLastDailyDraw(today);

                    <div className="tcard-icon" style={{ filter: isOwned ? 'drop-shadow(0 0 10px #7ddfff)' : 'grayscale(1) opacity(0.4)', fontSize: 36 }}>{s.icon}</div>
                    <div className="tcard-name" style={{ color: isOwned ? '#c4ecff' : '#556' }}>{isOwned ? s.name : '???'}</div>
                    {isActive && <div className="tcard-active">使用中</div>}
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        );
      })}

      {pulls && (
        <div className="gacha-results-overlay" onClick={revealStep >= pulls.length ? closeResults : undefined}>
          <div className="gacha-results">
            <div className="gr-grid">
              {pulls.map((p, i) => {
                const revealed = revealStep > i;
                const it = p.item;
                const KIND_LABELS = { theme: 'THEME', wire: 'WIRE', mirror: 'MIRROR', portal: 'PORTAL',
                  source: 'SOURCE', bulb: 'BULB', gate: 'GATE', switch: 'SWITCH', fuse: 'FUSE', gear: 'GEAR',
                  effect: 'EFFECT', sound: 'SOUND' };
                const kindLabel = KIND_LABELS[it.kind] || it.kind.toUpperCase();
                const KIND_TINTS = { theme: it.accent, wire: it.on, mirror: '#c4ecff', portal: '#d4afff',
                  source: '#ffd166', bulb: '#ffee44', gate: '#aab8d8', switch: '#a8e8ff',
                  fuse: '#ffa080', gear: '#c4b890', effect: '#ff7eb3', sound: '#7eff8a' };
                const tint = KIND_TINTS[it.kind] || '#7ddfff';
                const glow = it.kind === 'wire' ? it.glow : (it.glow || tint);
                return (
                  <div key={i} className={`gr-card r-${it.rarity}${revealed ? ' revealed' : ''}`}>
                    {revealed ? (
                      <>
                        <div className="gr-rarity" style={{ color: RARITY_INFO[it.rarity].color }}>{it.rarity}</div>
                        <div className="gr-kind">{kindLabel}</div>
                        <div className="gr-icon" style={{ filter: `drop-shadow(0 0 10px ${glow})` }}>{it.icon}</div>
                        <div className="gr-name" style={{ color: tint }}>{it.name}</div>
                        {p.isNew ? <div className="gr-new">NEW!</div> : <div className="gr-dup">+★{GACHA_DUPE_REFUND}</div>}
                      </>
                    ) : (
                      <div className="gr-back">?</div>
                    )}
                  </div>
                );
              })}
            </div>
            {revealStep >= pulls.length && (
              <button className="btn primary" onClick={closeResults} style={{ marginTop: 14 }}>閉じる</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ChallengeMode({ challengeBest, setChallengeBest, onBack }) {
  const [phase, setPhase] = useState('select'); // 'select' | 'playing' | 'result'
  const [duration, setDuration] = useState(null); // selected CHALLENGE_DURATIONS entry
  const [queue, setQueue] = useState([]);
  const [queuePos, setQueuePos] = useState(0);
  const [cleared, setCleared] = useState(0);
  const [perfectCount, setPerfectCount] = useState(0);
  const [timeLeft, setTimeLeft] = useState(0);
  const [popInfo, setPopInfo] = useState(null); // { key, bonus, perfect }
  const endTimeRef = useRef(0);
  const finalScoreRef = useRef(0);
  const finalNewBestRef = useRef(false);

  const startChallenge = (durEntry) => {
    setDuration(durEntry);
    setQueue(shuffleArray(Array.from({ length: CHALLENGE_POOL_SIZE }, (_, i) => i)));
    setQueuePos(0);
    setCleared(0);
    setPerfectCount(0);
    setPopInfo(null);
    setTimeLeft(durEntry.seconds * 1000);
    endTimeRef.current = Date.now() + durEntry.seconds * 1000;
    setPhase('playing');
  };

  // Tick timer while playing
  useEffect(() => {
    if (phase !== 'playing') return;
    const id = setInterval(() => {
      const left = endTimeRef.current - Date.now();
      if (left <= 0) {
        setTimeLeft(0);
        clearInterval(id);
        // finalize
        finalScoreRef.current = cleared;
        const key = duration.id;
        const prev = challengeBest?.[key] || 0;
        const isNew = cleared > prev;
        finalNewBestRef.current = isNew;
        if (isNew) {
          setChallengeBest(p => ({ ...(p || {}), [key]: cleared }));
        }
        setPhase('result');
      } else {
        setTimeLeft(left);
      }
    }, 100);
    return () => clearInterval(id);
  }, [phase, cleared, duration, challengeBest, setChallengeBest]);

  const fmt = (ms) => {
    const t = Math.max(0, Math.floor(ms));
    const totalSec = t / 1000;
    if (totalSec >= 60) {
      const m = Math.floor(totalSec / 60);
      const s = Math.floor(totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }
    // Under 60s: show with one decimal for tension
    return totalSec.toFixed(1);
  };

  if (phase === 'select') {
    return (
      <div className="screen">
        <div className="chal-select">
          <div className="chal-select-icon"><Icon name="flame" size={64} gold /></div>
          <div className="chal-select-title">無限チャレンジ</div>
          <div className="chal-select-sub">制限時間内に何ステージクリアできる？</div>
          <div className="chal-select-rules">
            ・制限時間 <b style={{ color: '#ffd166' }}>60秒</b> でスタート<br/>
            ・ステージはランダム（やさしい〜中級から出題）<br/>
            ・ヒント・やり直し・戻すは使用不可<br/>
            ・<span style={{ color: '#ffd166' }}>クリアで <b>+5秒</b>、最短手数なら <b>+10秒</b> ボーナス</span><br/>
            ・時間を伸ばし続ければ無限に挑戦可能
          </div>
          <div className="chal-option chal-option-single" onClick={() => startChallenge(CHALLENGE_DURATIONS[0])}>
            <div className="chal-option-time">START</div>
            <div className="chal-option-best">BEST {challengeBest?.['60'] || 0} ステージ</div>
          </div>
          <button className="btn" onClick={onBack} style={{ marginTop: 12, width: '100%' }}>← 戻る</button>
        </div>
      </div>
    );
  }

  if (phase === 'result') {
    const isNew = finalNewBestRef.current;
    const score = finalScoreRef.current;
    return (
      <div className="screen">
        <div className="chal-result">
          <div className="chal-result-label">CHALLENGE COMPLETE</div>
          <div className="chal-result-duration">制限時間 {duration.label}</div>
          <div className={`chal-result-score${isNew ? ' new' : ''}`}>{score}</div>
          <div className="chal-result-unit">STAGES CLEARED</div>
          {perfectCount > 0 && (
            <div className="chal-result-perfect">★ PERFECT × {perfectCount} ★</div>
          )}
          {isNew && score > 0 && <div className="chal-result-new">★ NEW BEST ★</div>}
          <div className="chal-result-best">BEST: {Math.max(score, challengeBest?.[duration.id] || 0)}</div>
          <button className="btn primary" onClick={() => startChallenge(duration)} style={{ marginTop: 18 }}>もう一度</button>
          <button className="btn" onClick={() => setPhase('select')}>ルールを見る</button>
          <button className="btn" onClick={onBack}>ステージ選択へ</button>
        </div>
      </div>
    );
  }

  // phase === 'playing'
  const stageIdx = queue[queuePos % queue.length];
  const stage = STAGES[stageIdx];
  const lowTime = timeLeft <= 10000;

  return (
    <div className="screen chal-playing">
      <div className="chal-hud">
        <div>
          <div className="chal-hud-label">残り時間</div>
          <div className={`chal-hud-time${lowTime ? ' low' : ''}`}>{fmt(timeLeft)}</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="chal-hud-label">クリア</div>
          <div className="chal-hud-cleared">{cleared}{perfectCount > 0 && <span className="chal-hud-perfect"> ★{perfectCount}</span>}</div>
        </div>
      </div>
      <div className="chal-stagename">{stage.name}</div>
      <GameScreen
        key={`chal-${queuePos}`}
        customStage={stage}
        stageKey={null}
        onBack={() => {}}
        onNext={null}
        bestStars={{}} setBestStars={() => {}}
        bestMoves={{}} setBestMoves={() => {}}
        challengeMode={true}
        onChallengeClear={(info) => {
          const isPerfect = !!info?.isPerfect;
          const bonus = CHAL_BONUS_MS + (isPerfect ? CHAL_PERFECT_BONUS_MS : 0);
          endTimeRef.current += bonus;
          setTimeLeft(t => t + bonus);
          setCleared(c => c + 1);
          if (isPerfect) setPerfectCount(p => p + 1);
          setPopInfo({ key: Date.now(), bonus, perfect: isPerfect });
          setQueuePos(p => {
            const next = p + 1;
            if (next >= queue.length) {
              setQueue(shuffleArray(Array.from({ length: CHALLENGE_POOL_SIZE }, (_, i) => i)));
              return 0;
            }
            return next;
          });
        }}
      />
      {popInfo && (
        <div key={popInfo.key} className={`chal-pop${popInfo.perfect ? ' perfect' : ''}`}>
          <div className="chal-pop-main">+1</div>
          {popInfo.perfect && <div className="chal-pop-perfect">PERFECT!</div>}
          <div className="chal-pop-bonus">+{popInfo.bonus / 1000}s</div>
        </div>
      )}
      <button className="btn chal-giveup" onClick={() => {
        finalScoreRef.current = cleared;
        const key = duration.id;
        const prev = challengeBest?.[key] || 0;
        const isNew = cleared > prev;
        finalNewBestRef.current = isNew;
        if (isNew && cleared > 0) {
          setChallengeBest(p => ({ ...(p || {}), [key]: cleared }));
        }
        setPhase('result');
      }}>あきらめる</button>
    </div>
  );
}

function App() {
  const [screen, setScreen]               = useState('select');
  const [tab, setTab]                     = useState('stages'); // 'stages' | 'myStages' | 'community' | 'profile'
  const [currentStage, setCurrentStage]   = useState(0);
  const [customPlayStage, setCustomPlay]  = useState(null); // { stage, stageKey, backScreen }
  const [editingStage, setEditingStage]   = useState(null); // user stage to edit, or null for new
  const [editorKey, setEditorKey]         = useState(0);    // force remount on return from test
  const [sharedStage, setSharedStage]     = useState(null); // stage decoded from URL hash

  const [bestStars, setBestStars] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_stars') || '{}'); } catch { return {}; }
  });
  const [bestMoves, setBestMoves] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_best_moves') || '{}'); } catch { return {}; }
  });
  const [bestTimes, setBestTimes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_best_times') || '{}'); } catch { return {}; }
  });
  const [challengeBest, setChallengeBest] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_challenge_best') || '{}'); } catch { return {}; }
  });
  const [starsSpent, setStarsSpent] = useState(() => {
    try { return parseInt(localStorage.getItem('cf_stars_spent') || '0', 10) || 0; } catch { return 0; }
  });
  const [themesOwned, setThemesOwned] = useState(() => {
    try {
      const arr = JSON.parse(localStorage.getItem('cf_themes_owned') || '["default"]');
      return Array.isArray(arr) ? arr : ['default'];
    } catch { return ['default']; }
  });
  const [activeTheme, setActiveTheme] = useState(() => {
    try { return localStorage.getItem('cf_theme_active') || 'default'; } catch { return 'default'; }
  });
  const [wireSkinsOwned, setWireSkinsOwned] = useState(() => {
    try {
      const arr = JSON.parse(localStorage.getItem('cf_wires_owned') || '["default"]');
      return Array.isArray(arr) ? arr : ['default'];
    } catch { return ['default']; }
  });
  const [activeWireSkin, setActiveWireSkin] = useState(() => {
    try { return localStorage.getItem('cf_wire_active') || 'default'; } catch { return 'default'; }
  });
  const [mirrorShapesOwned, setMirrorShapesOwned] = useState(() => {
    try { const arr = JSON.parse(localStorage.getItem('cf_mirrors_owned') || '["default"]'); return Array.isArray(arr) ? arr : ['default']; } catch { return ['default']; }
  });
  const [activeMirrorShape, setActiveMirrorShape] = useState(() => {
    try { return localStorage.getItem('cf_mirror_active') || 'default'; } catch { return 'default'; }
  });
  const [portalShapesOwned, setPortalShapesOwned] = useState(() => {
    try { const arr = JSON.parse(localStorage.getItem('cf_portals_owned') || '["default"]'); return Array.isArray(arr) ? arr : ['default']; } catch { return ['default']; }
  });
  const [activePortalShape, setActivePortalShape] = useState(() => {
    try { return localStorage.getItem('cf_portal_active') || 'default'; } catch { return 'default'; }
  });
  // Generic skin pool: source/bulb/gate/switch/fuse/gear/effect/sound
  const [skinPool, setSkinPool] = useState(() => {
    const out = {};
    for (const g of ALL_SHAPE_TYPES) {
      try {
        const owned = JSON.parse(localStorage.getItem(`cf_${g.storageKey}_owned`) || '["default"]');
        out[g.kind] = { owned: Array.isArray(owned) ? owned : ['default'], active: localStorage.getItem(`cf_${g.kind}_active`) || 'default' };
      } catch { out[g.kind] = { owned: ['default'], active: 'default' }; }
    }
    return out;
  });
  const setSkinKind = (kind, fn) => setSkinPool(p => ({ ...p, [kind]: fn(p[kind]) }));
  const setSkinOwned = (kind, owned) => setSkinKind(kind, s => ({ ...s, owned }));
  const setSkinActive = (kind, active) => setSkinKind(kind, s => ({ ...s, active }));
  useEffect(() => {
    for (const g of ALL_SHAPE_TYPES) {
      try { localStorage.setItem(`cf_${g.storageKey}_owned`, JSON.stringify(skinPool[g.kind].owned)); } catch {}
      try { localStorage.setItem(`cf_${g.kind}_active`, skinPool[g.kind].active); } catch {}
    }
  }, [skinPool]);
  // Apply effect-skin body class for clear/bulb animations
  useEffect(() => {
    const eff = skinPool.effect?.active || 'default';
    document.body.classList.remove('eff-default', 'eff-sparkle', 'eff-lightning');
    document.body.classList.add('eff-' + eff);
  }, [skinPool.effect?.active]);
  const [lastDailyDraw, setLastDailyDraw] = useState(() => {
    try { return localStorage.getItem('cf_daily_draw_last') || ''; } catch { return ''; }
  });
  const [userStages, setUserStages] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_user_stages') || '[]'); } catch { return []; }
  });
  const [streak, setStreak] = useState(() => {
    try { return parseInt(localStorage.getItem('cf_streak') || '0', 10) || 0; } catch { return 0; }
  });
  const [maxStreak, setMaxStreak] = useState(() => {
    try { return parseInt(localStorage.getItem('cf_max_streak') || '0', 10) || 0; } catch { return 0; }
  });
  const [dailyDone, setDailyDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_daily_done') || '{}'); } catch { return {}; }
  });
  const [achievements, setAchievements] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_achievements') || '{}'); } catch { return {}; }
  });
  const [newAchievement, setNewAchievement] = useState(null); // shows toast briefly
  const [settings, setSettings] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cf_settings') || '{}'); } catch { return {}; }
  });
  const [showSettings, setShowSettings] = useState(false);
  useEffect(() => { try { localStorage.setItem('cf_settings', JSON.stringify(settings)); } catch {} }, [settings]);
  const updateSetting = (key, val) => setSettings(prev => ({ ...prev, [key]: val }));

  // Detect shared stage from URL hash on first load
  useEffect(() => {
    const hash = window.location.hash.slice(1);
    const decoded = decodeStageFromHash(hash);
    if (decoded) {
      setSharedStage(decoded);
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }, []);

  // Update streak on mount (once per day)
  useEffect(() => {
    const last = localStorage.getItem('cf_last_play_date');
    const today = todayStr();
    if (last === today) return;
    let next;
    if (last === yesterdayStr()) next = streak + 1;
    else next = 1;
    setStreak(next);
    if (next > maxStreak) setMaxStreak(next);
    try { localStorage.setItem('cf_last_play_date', today); } catch {}
  }, []);

  // Persist new state
  useEffect(() => { try { localStorage.setItem('cf_streak', String(streak)); } catch {} }, [streak]);
  useEffect(() => { try { localStorage.setItem('cf_max_streak', String(maxStreak)); } catch {} }, [maxStreak]);
  useEffect(() => { try { localStorage.setItem('cf_daily_done', JSON.stringify(dailyDone)); } catch {} }, [dailyDone]);
  useEffect(() => { try { localStorage.setItem('cf_achievements', JSON.stringify(achievements)); } catch {} }, [achievements]);

  // Mark daily as done when today's daily stage gets cleared
  useEffect(() => {
    const today = todayStr();
    const idx = dailyStageIdx();
    if (bestStars[`stage_${idx}`] && !dailyDone[today]) {
      setDailyDone(prev => ({ ...prev, [today]: true }));
    }
  }, [bestStars]);

  // Auto-evaluate achievements
  useEffect(() => {
    const stateForCheck = { bestStars, streak, maxStreak, dailyDone, bestTimes, challengeBest };
    const next = { ...achievements };
    let firstNew = null;
    for (const a of ACHIEVEMENTS_LIST) {
      if (!next[a.id]) {
        try {
          if (a.check(stateForCheck)) {
            next[a.id] = true;
            if (!firstNew) firstNew = a;
          }
        } catch {}
      }
    }
    if (firstNew) {
      setAchievements(next);
      setNewAchievement(firstNew);
      const t = setTimeout(() => setNewAchievement(null), 3500);
      return () => clearTimeout(t);
    }
  }, [bestStars, streak, dailyDone, bestTimes, challengeBest]);

  const unlockedUpTo = (() => {
    let u = 0;
    for (let i = 0; i < STAGES.length; i++) {
      if (bestStars[`stage_${i}`]) u = Math.min(i + 1, STAGES.length - 1);
    }
    return u;
  })();

  const totalStarsEarned = Object.values(bestStars).reduce((a, b) => a + (b || 0), 0);
  const availableStars = Math.max(0, totalStarsEarned - starsSpent);
  const spendStars = (n) => setStarsSpent(s => s + n);

  useEffect(() => {
    try { localStorage.setItem('cf_stars', JSON.stringify(bestStars)); } catch {}
  }, [bestStars]);
  useEffect(() => {
    try { localStorage.setItem('cf_best_moves', JSON.stringify(bestMoves)); } catch {}
  }, [bestMoves]);
  useEffect(() => {
    try { localStorage.setItem('cf_best_times', JSON.stringify(bestTimes)); } catch {}
  }, [bestTimes]);
  useEffect(() => {
    try { localStorage.setItem('cf_challenge_best', JSON.stringify(challengeBest)); } catch {}
  }, [challengeBest]);
  useEffect(() => {
    try { localStorage.setItem('cf_stars_spent', String(starsSpent)); } catch {}
  }, [starsSpent]);
  useEffect(() => {
    try { localStorage.setItem('cf_themes_owned', JSON.stringify(themesOwned)); } catch {}
  }, [themesOwned]);
  useEffect(() => {
    try { localStorage.setItem('cf_theme_active', activeTheme); } catch {}
  }, [activeTheme]);
  useEffect(() => {
    try { localStorage.setItem('cf_wires_owned', JSON.stringify(wireSkinsOwned)); } catch {}
  }, [wireSkinsOwned]);
  useEffect(() => {
    try { localStorage.setItem('cf_wire_active', activeWireSkin); } catch {}
  }, [activeWireSkin]);
  useEffect(() => {
    try { localStorage.setItem('cf_mirrors_owned', JSON.stringify(mirrorShapesOwned)); } catch {}
  }, [mirrorShapesOwned]);
  useEffect(() => {
    try { localStorage.setItem('cf_mirror_active', activeMirrorShape); } catch {}
  }, [activeMirrorShape]);
  useEffect(() => {
    try { localStorage.setItem('cf_portals_owned', JSON.stringify(portalShapesOwned)); } catch {}
  }, [portalShapesOwned]);
  useEffect(() => {
    try { localStorage.setItem('cf_portal_active', activePortalShape); } catch {}
  }, [activePortalShape]);
  useEffect(() => {
    try { localStorage.setItem('cf_daily_draw_last', lastDailyDraw); } catch {}
  }, [lastDailyDraw]);

  // Apply active theme to :root CSS variables
  useEffect(() => {
    const t = THEMES_BY_ID[activeTheme] || THEMES_BY_ID.default;
    const r = document.documentElement.style;
    r.setProperty('--cf-bg-1', t.bg1);
    r.setProperty('--cf-bg-2', t.bg2);
    r.setProperty('--cf-accent', t.accent);
    r.setProperty('--cf-accent-2', t.accent2);
    r.setProperty('--cf-glow', t.glow);
    r.setProperty('--cf-glow-rgb', t.glowRgb);
    r.setProperty('--cf-title-shadow', t.titleShadow);

      setUserStages(prev => prev.map(s => s.id === editingStage.id ? { ...s, name, grid, minMoves } : s));
    } else {
      setUserStages(prev => [...prev, { id: `user_${Date.now()}`, name, grid, minMoves, isUserCreated: true }]);
    }
    setEditingStage(null);
    setScreen('select');
  };

  const handleDeleteUserStage = (id) => {
    setUserStages(prev => prev.filter(s => s.id !== id));
  };

  const renderScreen = () => {
    if (screen === 'challenge') {
      return (
        <ChallengeMode
          challengeBest={challengeBest}
          setChallengeBest={setChallengeBest}
          onBack={() => setScreen('select')}
        />
      );
    }
    if (screen === 'gacha') {
      return (
        <GachaScreen
          themesOwned={themesOwned}
          setThemesOwned={setThemesOwned}
          activeTheme={activeTheme}
          setActiveTheme={setActiveTheme}
          wireSkinsOwned={wireSkinsOwned}
          setWireSkinsOwned={setWireSkinsOwned}
          activeWireSkin={activeWireSkin}
          setActiveWireSkin={setActiveWireSkin}
          mirrorShapesOwned={mirrorShapesOwned}
          setMirrorShapesOwned={setMirrorShapesOwned}
          activeMirrorShape={activeMirrorShape}
          setActiveMirrorShape={setActiveMirrorShape}
          portalShapesOwned={portalShapesOwned}
          setPortalShapesOwned={setPortalShapesOwned}
          activePortalShape={activePortalShape}
          setActivePortalShape={setActivePortalShape}
          skinPool={skinPool}
          setSkinOwned={setSkinOwned}
          setSkinActive={setSkinActive}
          availableStars={availableStars}
          onSpendStars={spendStars}
          lastDailyDraw={lastDailyDraw}
          setLastDailyDraw={setLastDailyDraw}
          onBack={() => setScreen('select')}
        />
      );
    }
    if (screen === 'editor') {
      return (
        <StageEditor
          key={editorKey}
          initialStage={editingStage}
          onBack={() => { setEditingStage(null); setScreen('select'); }}
          onTestPlay={(tempStage) => {
            setEditingStage(prev => prev ? { ...prev, ...tempStage } : tempStage);
            setCustomPlay({ stage: tempStage, stageKey: null, backScreen: 'editor' });
            setScreen('game');
          }}
